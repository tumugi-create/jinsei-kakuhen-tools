<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6">
<title>人生確変ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
:root { --paper: #f5f0e6; --sheet: #fffdf8; --ink: #2a2622; --sub: #6b6358; --rule: #d6ccba; --shu: #b8392a; --shu-soft: #f5e2dd; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #1c1a17; --sheet: #24211d; --ink: #ece5d7; --sub: #a99f90; --rule: #4b453c; --shu: #e06a55; --shu-soft: #3c2520; }
}
:root[data-theme="dark"] { --paper: #1c1a17; --sheet: #24211d; --ink: #ece5d7; --sub: #a99f90; --rule: #4b453c; --shu: #e06a55; --shu-soft: #3c2520; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "BIZ UDPGothic", "Hiragino Sans", sans-serif; font-size: 19px; line-height: 1.8; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-family: "Klee One", serif; font-weight: 600; font-size: 1.45rem; margin: 0; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
p.sub { color: var(--sub); font-size: .85rem; margin: 10px 0 24px; }
.list { border-top: 1px solid var(--rule); }
a.tool { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; color: var(--ink); text-decoration: none; padding: 18px 4px; border-bottom: 1px solid var(--rule); min-height: 5.5rem; }
a.tool:active { background: var(--sheet); }
.seal { width: 3rem; height: 3rem; border-radius: 50%; border: 2.5px solid var(--shu); color: var(--shu); background: var(--shu-soft);
  display: flex; align-items: center; justify-content: center; font-family: "Klee One", serif; font-weight: 600; font-size: 1.3rem; transform: rotate(-8deg); }
a.tool b { display: block; font-family: "Klee One", serif; font-weight: 600; font-size: 1.2rem; }
a.tool small { display: block; font-size: .8rem; color: var(--sub); }
a.tool .go { color: var(--sub); font-size: 1.3rem; }
.soon { color: var(--sub); font-size: .8rem; padding: 16px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>人生確変ツール</h1>
  <p class="sub">本で読んだことを、毎日の習慣にするための道具</p>
  <div class="list">
    <a class="tool" href="ザ・マジック/">
      <span class="seal">謝</span>
      <span><b>ザ・マジック</b><small>28日間の感謝の記録（ロンダ・バーン）</small></span>
      <span class="go">›</span>
    </a>
  </div>
  <p class="soon">道具は、これから少しずつ増やしていきます。</p>
</div>
</body>
</html>
