<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2f86">
<title>人生確変ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #fbf7ef; --card: #fff; --ink: #2b2419; --muted: #6b604e; --line: #e4d9c4; --gold: #a87720; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #14122a; --card: #1e1b3a; --ink: #f3eee2; --muted: #b3acd0; --line: #3a3466; --gold: #e3b552; }
}
:root[data-theme="dark"] { --bg: #14122a; --card: #1e1b3a; --ink: #f3eee2; --muted: #b3acd0; --line: #3a3466; --gold: #e3b552; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; font-size: 19px; line-height: 1.7; }
.wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-family: "Shippori Mincho", serif; font-size: 1.5rem; margin: 0 0 4px; }
p.sub { color: var(--muted); font-size: .85rem; margin: 0 0 20px; }
a.tool {
  display: grid; grid-template-columns: 3rem 1fr auto; gap: 14px; align-items: center;
  background: linear-gradient(150deg, #3b2f86 0%, #6a3d9a 45%, #c2843a 100%); color: #fff;
  text-decoration: none; border-radius: 20px; padding: 20px; margin-bottom: 14px; min-height: 6rem;
  box-shadow: 0 4px 16px rgba(60,40,10,.15);
}
a.tool .ic { font-size: 2.2rem; text-align: center; }
a.tool b { display: block; font-family: "Shippori Mincho", serif; font-size: 1.25rem; }
a.tool small { display: block; font-size: .8rem; opacity: .9; }
a.tool .go { font-size: 1.5rem; }
.soon { border: 2px dashed var(--line); border-radius: 20px; padding: 18px; text-align: center; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✦ 人生確変ツール</h1>
  <p class="sub">本や考え方を、毎日の実践に変えるツール集</p>
  <a class="tool" href="ザ・マジック/">
    <span class="ic">🪄</span>
    <span><b>ザ・マジック</b><small>28日間の感謝の実践（ロンダ・バーン）</small></span>
    <span class="go">›</span>
  </a>
  <div class="soon">ここに新しいツールが増えていきます</div>
</div>
</body>
</html>
