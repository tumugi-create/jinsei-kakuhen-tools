<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ザ・マジック">
<meta name="theme-color" content="#f5f0e6">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ザ・マジック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f5f0e6;
  --sheet: #fffdf8;
  --ink: #2a2622;
  --sub: #6b6358;
  --rule: #d6ccba;
  --rule-soft: #e8e0d1;
  --shu: #b8392a;
  --shu-soft: #f5e2dd;
  --ai: #2d4a78;
  --mark: #fff1bd;
  --on-ink: #fffdf8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c1a17; --sheet: #24211d; --ink: #ece5d7; --sub: #a99f90; --rule: #4b453c; --rule-soft: #35302a;
    --shu: #e06a55; --shu-soft: #3c2520; --ai: #9fb7e0; --mark: #4a4128; --on-ink: #1c1a17;
  }
}
:root[data-theme="dark"] {
  --paper: #1c1a17; --sheet: #24211d; --ink: #ece5d7; --sub: #a99f90; --rule: #4b453c; --rule-soft: #35302a;
  --shu: #e06a55; --shu-soft: #3c2520; --ai: #9fb7e0; --mark: #4a4128; --on-ink: #1c1a17;
}
/* 文字の大きさ（設定で切りかえ） */
html { font-size: 18px; }
html[data-size="m"] { font-size: 16px; }
html[data-size="l"] { font-size: 19px; }
html[data-size="xl"] { font-size: 22px; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  font-size: 1rem;
  line-height: 1.8;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
.hand { font-family: "Klee One", "Hiragino Mincho ProN", serif; }
.wrap { max-width: 720px; margin: 0 auto; padding: 8px 16px calc(96px + env(safe-area-inset-bottom)); }
h1, h2, h3 { font-family: "Klee One", "Hiragino Mincho ProN", serif; font-weight: 600; line-height: 1.45; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--ai); }

/* 入力欄：罫線のノート */
input[type="text"], textarea {
  font-family: "Klee One", "Hiragino Mincho ProN", serif; font-size: max(16px, 1.05rem); color: var(--ink);
  background: transparent; border: 0; border-bottom: 1.5px solid var(--rule); border-radius: 0;
  padding: 8px 4px 6px; width: 100%; min-height: 3rem; -webkit-appearance: none; appearance: none;
}
textarea {
  min-height: 7.2rem; resize: vertical; line-height: 2.4rem; padding: 0 4px; border: 0;
  background-image: repeating-linear-gradient(transparent 0, transparent calc(2.4rem - 1.5px), var(--rule) calc(2.4rem - 1.5px), var(--rule) 2.4rem);
  background-attachment: local;
}
input::placeholder, textarea::placeholder { color: var(--sub); opacity: .6; font-family: "BIZ UDPGothic", sans-serif; font-size: .9em; }
input[type="text"]:focus, textarea:focus { outline: none; background-color: var(--mark); border-bottom-color: var(--ink); }

/* 上の見出し */
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 12px 0 10px; border-bottom: 2px solid var(--ink); margin-bottom: 4px; }
header.top .title { font-family: "Klee One", serif; font-weight: 600; font-size: 1.35rem; line-height: 1.2; }
header.top .sub { display: block; font-size: .7rem; color: var(--sub); margin-top: 2px; }
header.top .count { font-size: .75rem; color: var(--sub); white-space: nowrap; text-align: right; }
header.top .count b { font-family: "Klee One", serif; font-size: 1.25rem; color: var(--shu); margin: 0 2px; }

/* タブ：スマホは画面の下、PCは見出しの下 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; background: var(--sheet); border-top: 1px solid var(--rule);
  padding: 0 0 env(safe-area-inset-bottom);
}
nav.tabs button {
  flex: 1; border: 0; background: transparent; color: var(--sub); min-height: 60px; padding: 0 2px;
  font-size: .85rem; font-weight: 700; border-top: 3px solid transparent;
}
nav.tabs button[aria-current="true"] { color: var(--ink); border-top-color: var(--shu); }
@media (min-width: 768px) {
  .wrap { padding-bottom: 48px; }
  nav.tabs { position: static; background: transparent; border-top: 0; border-bottom: 1px solid var(--rule); margin-bottom: 20px; padding: 0; gap: 4px; justify-content: flex-start; }
  nav.tabs button { flex: none; min-height: 48px; padding: 0 18px; font-size: .9rem; border-top: 0; border-bottom: 3px solid transparent; }
  nav.tabs button[aria-current="true"] { border-bottom-color: var(--shu); }
}

/* 紙 */
.sheet { background: var(--sheet); border: 1px solid var(--rule-soft); border-radius: 4px; padding: 20px; margin-bottom: 16px; }
.sheet > h3 { font-size: 1.15rem; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.hint { color: var(--sub); font-size: .9rem; margin: 0 0 14px; }
.aside { font-size: .85rem; color: var(--sub); border-left: 3px solid var(--rule); padding: 2px 0 2px 12px; margin: 0 0 16px; }

/* 今日の見出し */
.dayhead { padding: 22px 2px 18px; }
.dayhead .dno { font-size: .85rem; color: var(--sub); }
.dayhead .dno b { font-family: "Klee One", serif; font-size: 1.6rem; color: var(--shu); margin-right: 2px; }
.dayhead h2 { font-size: 1.75rem; margin: 2px 0 6px; }
.dayhead .lead { margin: 0; }
.dayhead .phase { font-size: .8rem; color: var(--sub); margin: 8px 0 0; }
.meta { display: flex; gap: 18px; font-size: .85rem; color: var(--sub); padding: 0 2px 14px; }
.meta b { color: var(--ink); font-family: "Klee One", serif; font-size: 1.05rem; }

/* 判子 */
.seal {
  width: 2.8rem; height: 2.8rem; flex: none; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: "Klee One", serif; font-weight: 600; font-size: 1.15rem; line-height: 1;
  border: 1.5px dashed var(--rule); color: var(--sub);
}
.seal.on { border: 2.5px solid var(--shu); color: var(--shu); background: var(--shu-soft); transform: rotate(-8deg); }

/* 今日やること */
.tasks { border-top: 1px solid var(--rule); margin-bottom: 20px; }
.task {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: transparent; border: 0; border-bottom: 1px solid var(--rule); padding: 14px 4px; min-height: 5rem;
}
.task:active { background: var(--rule-soft); }
.task .tx b { display: block; font-size: 1.1rem; }
.task .tx small { display: block; font-size: .85rem; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .tx { min-width: 0; }
.task .go { font-size: .9rem; color: var(--ai); font-weight: 700; white-space: nowrap; }
.task.done .go { color: var(--shu); }

.back { border: 0; background: transparent; color: var(--ai); font-weight: 700; padding: 14px 0; min-height: 48px; font-size: 1rem; }

.daynav { display: flex; justify-content: space-between; gap: 8px; margin: 8px 0 16px; }
.daynav button { border: 0; background: transparent; color: var(--ai); min-height: 44px; padding: 0 4px; font-size: .9rem; }
.daynav button:disabled { color: var(--rule); cursor: default; }

.howto-steps { margin: 0; padding-left: 1.5em; }
.howto-steps li { margin-bottom: 6px; }
.howto-steps li::marker { font-family: "Klee One", serif; color: var(--shu); font-weight: 600; }

/* 書く行 */
.row { display: grid; grid-template-columns: 1.8rem 1fr auto; gap: 6px 12px; align-items: start; margin-bottom: 18px; }
.row .no { font-family: "Klee One", serif; color: var(--shu); font-weight: 600; text-align: right; padding-top: 12px; font-size: 1.1rem; }
.row.solo { align-items: end; }
.row .fields { display: grid; gap: 0; min-width: 0; }
.row .fields input.why { font-size: max(16px, .92rem); min-height: 2.6rem; color: var(--sub); }
.row.solo { grid-template-columns: 1fr auto; }

.thx {
  border: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink); font-weight: 700;
  border-radius: 6px; padding: 6px 14px; min-height: 3rem; white-space: nowrap; min-width: 9.5rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: .95rem;
}
.thx:active { transform: translateY(1px); }
.thx .dots { display: inline-flex; gap: 4px; }
.thx .dots i { width: .7rem; height: .7rem; border-radius: 50%; border: 1.5px solid var(--sub); }
.thx .dots i.on { background: var(--shu); border-color: var(--shu); }
.thx.full { border-color: var(--shu); color: var(--shu); background: var(--shu-soft); }

.person { border-top: 1px solid var(--rule-soft); padding-top: 18px; margin-top: 18px; }
.person:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.person .pname { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; margin-bottom: 8px; }
.person .pname input { font-weight: 600; }

label.chk { display: flex; gap: 12px; align-items: center; padding: 8px 0; min-height: 48px; cursor: pointer; }
label.chk input { width: 26px; height: 26px; accent-color: var(--shu); flex: none; margin: 0; }
.field { margin-bottom: 20px; }
.field > .lbl { display: block; font-size: .95rem; font-weight: 700; margin-bottom: 2px; }

.counter { text-align: center; }
.counter .big { font-family: "Klee One", serif; font-size: 3rem; line-height: 1.2; }
.counter .big small { font-size: 1rem; color: var(--sub); }
.bar { height: 6px; background: var(--rule-soft); overflow: hidden; margin: 10px 0 16px; }
.bar > i { display: block; height: 100%; background: var(--shu); transition: width .3s; }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--ink); background: var(--sheet); border-radius: 6px; padding: 10px 18px; min-height: 3rem; font-size: .95rem; font-weight: 700; }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn.big { padding: 14px 26px; font-size: 1.1rem; min-height: 3.6rem; }
.btn.wide { width: 100%; max-width: 480px; }
.btn.plain { border-color: var(--rule); font-weight: 400; }
.btn.danger { color: var(--shu); border-color: var(--shu); }
.link { border: 0; background: transparent; color: var(--ai); text-decoration: underline; padding: 8px; min-height: 44px; font-size: .9rem; }

.breath { text-align: center; }
.orb { width: 132px; height: 132px; margin: 8px auto 12px; border-radius: 50%; border: 2px solid var(--ai); background: transparent;
  transform: scale(.55); transition: transform 4s ease-in-out; }
.orb.in { transform: scale(1); background: rgba(45,74,120,.08); }
.breath .say { min-height: 1.8em; font-weight: 700; font-size: 1.1rem; }

/* 終える */
.finish { text-align: center; padding: 8px 0 4px; }
.finish .note { font-size: .8rem; color: var(--sub); margin: 8px 0 0; }
.finished { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 8px 0; }
.finished .seal { width: 4rem; height: 4rem; font-size: 1.5rem; }
.finished p { margin: 0; text-align: left; }

.word { font-family: "Klee One", serif; border-left: 3px solid var(--shu); padding: 4px 0 4px 14px; margin: 20px 2px; font-size: 1.05rem; }
.word small { display: block; font-family: "BIZ UDPGothic", sans-serif; font-size: .72rem; color: var(--sub); }

/* 28日の表 */
.weeks { display: grid; gap: 10px; }
.wk { display: grid; grid-template-columns: 3.4rem 1fr; align-items: center; gap: 8px; }
.wk .wl { font-size: .75rem; color: var(--sub); }
.cells { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cell {
  aspect-ratio: 1; border: 1px solid var(--rule); background: var(--sheet); border-radius: 2px; min-width: 0; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: "Klee One", serif; font-size: 1.05rem; line-height: 1.1; position: relative;
}
.cell small { font-family: "BIZ UDPGothic", sans-serif; font-size: .55rem; color: var(--sub); }
.cell.on::before {
  content: ""; position: absolute; inset: 12%; border-radius: 50%; border: 2px solid var(--shu); transform: rotate(-8deg);
}
.cell.on { color: var(--shu); }
.cell.cur { border: 2px solid var(--ink); }
.cell:disabled { color: var(--rule); cursor: default; }
.legend { font-size: .75rem; color: var(--sub); margin: 12px 0 0; }
.phase-h { font-size: .85rem; color: var(--sub); font-weight: 700; margin: 18px 0 2px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
.phase-h:first-of-type { margin-top: 4px; }

.log-item { display: grid; grid-template-columns: 4.4rem 1fr; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--rule-soft); cursor: pointer; min-height: 48px; }
.log-item .d { font-family: "Klee One", serif; font-weight: 600; }
.log-item .d small { display: block; font-family: "BIZ UDPGothic", sans-serif; font-weight: 400; color: var(--sub); font-size: .72rem; }
.log-item .best { font-family: "Klee One", serif; font-size: .9rem; color: var(--sub); }
.log-item.off { opacity: .45; pointer-events: none; }

.intro h2 { font-size: 1.6rem; margin: 20px 0 8px; }
.intro p { margin: 0 0 12px; }
.daily { list-style: none; padding: 0; margin: 0 0 18px; border-top: 1px solid var(--rule); }
.daily li { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--rule); }
.small { font-size: .78rem; color: var(--sub); }
.wish-cat { margin-bottom: 18px; }
.wish-cat .lbl { font-weight: 700; font-size: .95rem; }
.opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
.opt-row .btn { flex: 1; min-width: 6rem; font-weight: 400; border-color: var(--rule); }
.opt-row .btn[aria-pressed="true"] { border: 2px solid var(--ink); font-weight: 700; }
.howto { margin: 0; padding-left: 1.3em; font-size: .9rem; }

.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); opacity: 0;
  background: var(--ink); color: var(--on-ink); padding: 10px 20px; border-radius: 6px; font-size: .95rem;
  transition: opacity .25s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; }
@media (min-width: 768px) { .toast { bottom: 24px; } }

/* 判子を押す画面 */
.party { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(28,26,23,.45); animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
.party .box { background: var(--sheet); border-radius: 4px; padding: 28px 22px 20px; text-align: center; max-width: 400px; width: 100%; }
.hanko {
  width: 150px; height: 150px; margin: 0 auto 14px; border-radius: 50%; border: 5px solid var(--shu); color: var(--shu);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Klee One", serif; font-weight: 600;
  transform: rotate(-10deg); animation: press .45s cubic-bezier(.2,.9,.3,1.2) .1s both;
}
.hanko .d { font-size: 1.05rem; line-height: 1.2; }
.hanko .k { font-size: 3.6rem; line-height: 1; }
.hanko .dt { font-size: .8rem; line-height: 1.2; opacity: .85; }
@keyframes press { from { transform: rotate(-10deg) scale(1.9); opacity: 0; } 70% { transform: rotate(-10deg) scale(.94); opacity: 1; } to { transform: rotate(-10deg) scale(1); } }
.party h2 { font-size: 1.3rem; margin: 0 0 6px; }
.party p { margin: 0 0 14px; }
.party .stat { font-size: .85rem; color: var(--sub); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* スマホ：ありがとうボタンは入力欄の下に、横いっぱいで */
@media (max-width: 600px) {
  .sheet { padding: 16px 14px; }
  .row { grid-template-columns: 1.4rem 1fr; }
  .row .thx { grid-column: 2; width: 100%; margin-top: 6px; }
  .row.solo { grid-template-columns: 1fr; }
  .row.solo .thx { grid-column: 1; }
  .person .pname { grid-template-columns: 1fr; }
  .person .pname .thx { width: 100%; }
  .dayhead h2 { font-size: 1.5rem; }
  .wk { grid-template-columns: 1fr; gap: 2px; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
// 各日の内容は、本の要点を自分の言葉で短くまとめたもの。くわしいやり方は本で確かめる。
const MORNING = { type: 'list', key: 'm', n: 10, why: true, thanks: 3,
  ph: '例：あたたかい布団で目覚めた', whyPh: 'なぜありがたい？' };

const DAYS = [
  { t: '恵みを数える', en: 'Count Your Blessings', lead: '今あるものに感謝するところから始めます。',
    steps: ['朝、ありがたいと思うことを10個書く', 'それぞれに「なぜありがたいのか」も書く', '1つずつ読み返し、心をこめて「ありがとう」を3回言う（ボタンを3回押す）', 'この朝の習慣は、28日目まで毎朝続けます'],
    f: [] },
  { t: '魔法の石', en: 'The Magic Rock', lead: '一日の終わりに、いちばんよかったことに感謝します。',
    steps: ['手のひらに収まる石をひとつ見つける', '寝る場所の近くに置く', '夜、石を手に持って、今日いちばんよかったことを思い出し「ありがとう」と言う', 'この夜の習慣も、28日目まで毎晩続けます'],
    f: [{ type: 'check', key: 'c', items: ['石を見つけた', '寝る場所の近くに置いた'] }] },
  { t: '魔法の人間関係', en: 'Magical Relationships', lead: '身近な人との関係に感謝を向けます。',

    f: [{ type: 'people', key: 'p', n: 3, items: 5 }] },
  { t: '魔法の健康', en: 'Magical Health', lead: '自分の体と健康に感謝します。',
    steps: ['体や健康について、ありがたいことを書き出す（見える目、歩ける足、動き続ける心臓 など）', '1つずつ「ありがとう」', '今日一日、体の働きに気づいたら心の中で感謝する'],
    f: [{ type: 'list', key: 'h', n: 5, thanks: 3, label: '体と健康の恵み', ph: '例：好きな景色を見られる目' }] },
  { t: '魔法のお金', en: 'Magic Money', lead: 'これまでお金がもたらしてくれたものに感謝します。',
    steps: ['子どものころから今までに、お金のおかげで受け取れたもの・できた経験を思い出して書く', '1つずつ「ありがとう」', 'お札1枚に「今まで受け取ったすべてのお金にありがとう」と書いたメモを付け、財布に入れて持ち歩く'],
    f: [{ type: 'list', key: 'mo', n: 10, thanks: 3, label: 'お金のおかげで受け取れたもの', ph: '例：親が買ってくれた自転車' },
        { type: 'check', key: 'c', items: ['メモを付けたお札を財布に入れた'] }] },
  { t: '魔法のように働く', en: 'Works Like Magic', lead: '仕事（家事や勉強も含む）に感謝します。',
    steps: ['仕事についてありがたいことを書き出す（仕事があること、仲間、道具、学べること など）', '1つずつ「ありがとう」', '仕事中、まわりの人や物に気づいたら心の中で感謝する'],
    f: [{ type: 'list', key: 'w', n: 10, thanks: 3, label: '仕事の恵み', ph: '例：困った時に助けてくれる同僚' }] },
  { t: 'ネガティブから抜け出す', en: 'The Magical Way Out of Negativity', lead: '悩みの中にもある恵みを探します。',
    steps: ['今かかえている問題を1つ選ぶ', 'その問題に関係することで、それでもありがたいことを10個書く', '最後に、問題が解決したことに先に「ありがとう」'],
    f: [{ type: 'text', key: 'prob', label: '選んだ問題', ph: '例：職場の人間関係' },
        { type: 'list', key: 'ng', n: 10, thanks: 3, label: 'それでもありがたいこと' },

  const cur = currentDay();
  if (ui.n == null) ui.n = cur;
  let h = `<header class="top"><div><span class="title">ザ・マジック</span><span class="sub">28日間の感謝の記録</span></div>
    <div class="count">ありがとう<b id="total">${S.total}</b>回</div></header>`;
  if (!S.started) { app.innerHTML = h + intro(); return; }
  const tabs = [['today', '今日'], ['map', '28日'], ['log', '記録'], ['wish', '願い'], ['set', '設定']];
  h += `<nav class="tabs">${tabs.map(([k, l]) => `<button data-act="tab" data-tab="${k}" aria-current="${ui.tab === k}">${l}</button>`).join('')}</nav>`;
  if (ui.tab === 'today') h += ui.sec ? viewSection() : viewHome(cur);
  else h += { map: viewMap, log: viewLog, wish: viewWish, set: viewSet }[ui.tab](cur);
  app.innerHTML = h;
}

function optRow(act, opts, val) {
  return `<div class="opt-row">${opts.map(([k, l]) => `<button class="btn" data-act="${act}" data-v="${k}" aria-pressed="${val === k}">${l}</button>`).join('')}</div>`;
}
const SIZES = [['m', 'ふつう'], ['l', '大きい'], ['xl', 'とても大きい']];

function intro() {
  return `<div class="intro">
    <h2>28日間、毎日「ありがとう」を書く</h2>
    <p>ロンダ・バーンさんの本『ザ・マジック』にある28日間の感謝の練習を、このノートに書きながら進めます。</p>
    <p>毎日やるのは次の3つです。</p>
    <ul class="daily">
      <li><span class="seal">朝</span><div><b>朝の感謝</b><br><span class="small">ありがたいことを10個書いて、1つずつ「ありがとう」</span></div></li>
      <li><span class="seal">実</span><div><b>今日の実践</b><br><span class="small">日ごとにちがう練習。やり方はその日に出ます</span></div></li>
      <li><span class="seal">夜</span><div><b>夜の石</b><br><span class="small">石を手に、今日いちばんよかったことに「ありがとう」（2日目から）</span></div></li>
    </ul>
    <p>用意するもの：手のひらに収まる石ひとつ（2日目）、大切な人の写真（3日目）</p>
    <div class="sheet"><h3>文字の大きさ</h3>${optRow('size', SIZES, curSize())}<p class="small" style="margin:10px 0 0">あとから「設定」でも変えられます。</p></div>
    <div class="btns"><button class="btn ink big wide" data-act="start">1日目をはじめる</button></div>
    <p class="small" style="margin-top:18px">書いたことは、この機械（スマホ・パソコン）の中だけに残ります。ほかの人には見えません。<br>各日の内容は本の要点を短くまとめたものです。くわしくは本で確かめてください。</p>
  </div>`;
}

function task(sec, ch, title, sub, done) {
  return `<button class="task ${done ? 'done' : ''}" data-act="sec" data-sec="${sec}"><span class="seal ${done ? 'on' : ''}">${ch}</span>
    <span class="tx"><b>${esc(title)}</b><small>${esc(sub)}</small></span><span class="go">${done ? '済' : '書く ›'}</span></button>`;
}

function viewHome(cur) {
  const n = ui.n, def = dayDef(n), r = rec(n), d = r.data, ph = phaseOf(n);
  let h = `<div class="dayhead"><div class="dno"><b>${n}</b>日目${n <= 28 ? '　／ 28日' : ''}</div>
    <h2>${esc(def.t)}</h2><p class="lead">${esc(def.lead)}</p>
    ${ph ? `<p class="phase">${ph.from}〜${ph.to}日目は「${ph.name}」</p>` : ''}</div>`;
  h += `<div class="meta"><span>続けて <b>${streak()}</b> 日</span><span>済んだ日 <b>${doneCount()}</b> / 28</span></div>`;
  const fm = filledM(d), items = [];
  items.push(task('m', '朝', n === 1 ? '朝の感謝（これが今日の実践）' : '朝の感謝', `${fm} / 10個 書きました`, fm >= 10));
  if (def.f.length) items.push(task('p', '実', '今日の実践', def.t, false));
  if (n >= 2) items.push(task('r', '夜', '夜の石', d.rock?.t || '寝る前に', !!getP(d, 'rock.c')));
  h += `<div class="tasks">${items.join('')}</div>`;
  if (r.done) {
    h += `<div class="finished"><span class="seal on">済</span><p>${n}日目は ${fmtDate(r.done)} に済みました。<br><span class="small">${n < 28 ? 'また明日。' : n === 28 ? '28日間、おつかれさまでした。' : ''}</span></p></div>
      <div class="btns"><button class="link" data-act="undone">済みを取り消す</button></div>`;
  } else if (n === cur) {
    const doneToday = Object.values(S.days).some(x => x.done === today());
    h += `<div class="finish">
      ${doneToday ? '<p class="hint">今日はもう1日分を終えています。1日に1つずつ進めるのがおすすめです。</p>' : ''}
      <button class="btn ink big wide" data-act="done">今日の分を終える</button>
      <p class="note">ぜんぶ書けていなくても終えられます。</p></div>`;
  }
  h += `<div class="word"><small>ひとこと</small>${WORDS[(n - 1) % WORDS.length]}</div>`;
  h += `<div class="daynav"><button data-act="go" data-n="${n - 1}" ${n <= 1 ? 'disabled' : ''}>‹ 前の日</button>
    ${n !== cur ? `<button data-act="go" data-n="${cur}">今の日へ</button>` : ''}
    <button data-act="go" data-n="${n + 1}" ${n >= cur ? 'disabled' : ''}>次の日 ›</button></div>`;
  return h;
}

const stepsBox = def => `<div class="sheet"><h3>やり方</h3><ol class="howto-steps">${def.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>`;

function viewSection() {
  const n = ui.n, def = dayDef(n), s = ui.sec;
  let h = '<button class="back" data-act="home">‹ 今日に戻る</button>';
  if (s === 'm') {
    if (n === 1) h += stepsBox(def);
    h += `<div class="sheet"><h3><span class="seal">朝</span>朝の感謝</h3><p class="hint">ありがたいことを10個書きます。下の欄に理由も書けたら書きましょう。<br>書いたら1つずつ、心をこめて「ありがとう」を3回（ボタンを3回押す）。</p>${voiceHint()}${fList(MORNING)}</div>`;
  } else if (s === 'p') {
    h += stepsBox(def) + `<div class="sheet"><h3><span class="seal">実</span>${esc(def.t)}</h3>${voiceHint()}${def.f.map(field).join('')}</div>`;
  } else {
    h += `<div class="sheet"><h3><span class="seal">夜</span>夜の石</h3><p class="hint">石を手に持って、今日いちばんよかったことを思い出します。書いたら「ありがとう」。</p>${voiceHint()}
      <div class="row solo"><div class="fields">${inp('rock.t', '今日いちばんよかったこと')}</div>${thxBtn('rock.c', 1)}</div></div>`;
  }
  h += '<div class="btns"><button class="btn ink big wide" data-act="home">書けたら、今日に戻る</button></div>';
  return h;
}

function viewMap(cur) {
  const cell = n => {
    const r = S.days[n];
    return `<button class="cell ${r?.done ? 'on' : ''} ${n === cur ? 'cur' : ''}" data-act="go" data-n="${n}" ${n > cur ? 'disabled' : ''} title="${esc(DAYS[n - 1].t)}">${n}<small>${r?.done ? fmtDate(r.done) : ''}</small></button>`;
  };
  let h = `<div class="sheet"><h3>28日の表</h3><div class="weeks">`;
  for (let w = 0; w < 4; w++) {
    h += `<div class="wk"><span class="wl">${w + 1}週目</span><div class="cells">`;
    for (let n = w * 7 + 1; n <= w * 7 + 7; n++) h += cell(n);
    h += '</div></div>';
  }
  const dc = doneCount(), extra = Object.keys(S.days).filter(k => +k > 28 && S.days[k].done).length;
  h += `</div><p class="legend">朱の丸が済んだ日、太い枠が今の日です。${dc >= 28 ? '28日、すべて済みました。' : `残りは ${28 - dc} 日。`}${extra ? `　29日目からも ${extra} 日続けています。` : ''}</p></div>`;
  h += '<div class="sheet"><h3>28の実践</h3>';
  for (const p of PHASES) {
    h += `<div class="phase-h">${p.from}〜${p.to}日目　${p.name}</div>`;
    for (let n = p.from; n <= p.to; n++) {
      const d = DAYS[n - 1];
      h += `<div class="log-item ${n > cur ? 'off' : ''}" data-act="go" data-n="${n}"><div class="d">${n}日目</div><div>${esc(d.t)}<div class="best">${esc(d.lead)}</div></div></div>`;
    }
  }
  return h + '</div>';
}

function viewLog() {
  const done = Object.entries(S.days).filter(([, r]) => r.done).sort((a, b) => b[0] - a[0]);
  if (!done.length) return '<div class="sheet"><p class="hint" style="margin:0">まだ記録がありません。1日目を終えると、ここに並びます。</p></div>';
  return `<div class="sheet"><h3>これまでの記録</h3><p class="hint">夜の石に書いた「今日いちばんよかったこと」を読み返せます。押すとその日を開けます。</p>
    ${done.map(([n, r]) => `<div class="log-item" data-act="go" data-n="${n}"><div class="d">${n}日目<small>${fmtDate(r.done)}</small></div>
      <div>${esc(dayDef(+n).t)}<div class="best">${r.data.rock?.t ? esc(r.data.rock.t) : '朝の感謝 ' + filledM(r.data) + '個'}</div></div></div>`).join('')}</div>`;
}

function viewWish() {
  return `<div class="sheet"><h3>願いのリスト</h3><p class="hint">叶えたいことを、分野ごとに書いておきます。13日目からの実践で使います。いつでも書き足せます。</p>${voiceHint()}
    ${WISH_CATS.map(([k, l]) => `<div class="wish-cat"><div class="lbl">${l}</div>${[0, 1, 2].map(i =>
      `<input type="text" data-w="${k}.${i}" value="${esc(getP(S.wishes, `${k}.${i}`))}" placeholder="${i === 0 ? '願いを書く' : ''}">`).join('')}</div>`).join('')}</div>`;
}

function viewSet() {
  return `<div class="sheet"><h3>文字の大きさ</h3>${optRow('size', SIZES, curSize())}</div>
    <div class="sheet"><h3>画面の色</h3>${optRow('theme', [['auto', '自動'], ['light', '明るい'], ['dark', '暗い']], S.theme)}</div>
    <div class="sheet"><h3>スマホのホーム画面に置く</h3><p class="hint">ホーム画面のアイコンから、すぐ開けるようになります。書いたことも消えにくくなります。</p>
      <ul class="howto"><li><b>iPhone</b>：Safariで開いて、下の共有ボタン（四角に上向き矢印）→「ホーム画面に追加」</li>
      <li><b>Android</b>：Chromeで開いて、右上の「︙」→「ホーム画面に追加」</li></ul></div>
    <div class="sheet"><h3>控えを取る</h3><p class="hint">書いたことはこの機械の中だけにあります。機械を替える時や念のために、ときどきファイルに書き出してください。別の機械では「読みこむ」で続きから使えます。</p>
    <div class="btns" style="justify-content:flex-start"><button class="btn ink" data-act="export">ファイルに書き出す</button><button class="btn" data-act="import">ファイルから読みこむ</button></div></div>
    <div class="sheet"><h3>最初からやり直す</h3><p class="hint">書いたことをすべて消して、1日目に戻ります。先に控えを取るのがおすすめです。</p>
    <button class="btn danger" data-act="reset">すべて消す</button></div>
    <p class="small">はじめた日：${esc(S.started)}</p>`;
}

// ---------- 合図 ----------
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
const buzz = () => { try { navigator.vibrate?.(12); } catch (e) {} };
function stamp(n) {
  const msg = MILES[n] || (n === 1 ? '最初の一日が済みました。明日の朝も、10個の「ありがとう」から。' : '今日の分が済みました。また明日。');
  const left = Math.max(0, 28 - doneCount());
  const el = document.createElement('div');
  el.className = 'party';
  el.innerHTML = `<div class="box"><div class="hanko"><span class="d">${n}日目</span><span class="k">済</span><span class="dt">${fmtDate(today())}</span></div>
    <h2>${n}日目が済みました</h2><p>${esc(msg)}</p>
    <p class="stat">ありがとう ${S.total}回${n < 28 ? `　・　残り ${left}日` : ''}</p>
    <button class="btn ink big wide" data-close>閉じる</button></div>`;
  el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) el.remove(); });
  document.body.appendChild(el);
  try { navigator.vibrate?.([20, 60, 40]); } catch (e) {}
}
function addTotal(k = 1) {
  S.total = (S.total || 0) + k;
  const t = document.getElementById('total');
  if (t) t.textContent = S.total;
}
function morningAllDone() {
  const m = rec(ui.n).data.m || {};
  return [...Array(10).keys()].every(i => m[i]?.t?.trim() && m[i].c >= 3);
}

// ---------- 操作 ----------
const app = document.getElementById('app');
app.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.k) { setP(rec(ui.n).data, el.dataset.k, el.type === 'checkbox' ? el.checked : el.value); save(); }
  else if (el.dataset.w) { setP(S.wishes, el.dataset.w, el.value); save(); }
});
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, k = el.dataset.k, d = rec(ui.n).data;
  switch (act) {
    case 'start':
      S.started = today(); save(); ui.n = 1;
      navigator.storage?.persist?.().catch(() => {});
      render(); break;
    case 'tab': ui.tab = el.dataset.tab; ui.sec = null; if (ui.tab === 'today') ui.n = currentDay(); render(); scrollTo(0, 0); break;
    case 'go': ui.n = Math.max(1, +el.dataset.n); ui.tab = 'today'; ui.sec = null; render(); scrollTo(0, 0); break;
    case 'sec': ui.sec = el.dataset.sec; render(); scrollTo(0, 0); break;
    case 'home': ui.sec = null; render(); scrollTo(0, 0); break;
    case 'thanks': {
      const max = +el.dataset.max, v = +getP(d, k) || 0;
      if (v < max) { setP(d, k, v + 1); addTotal(); save(); buzz(); }
      el.outerHTML = thxBtn(k, max);
      if (v < max && k.startsWith('m.') && morningAllDone()) toast('朝の感謝、10個すべて済みました');
      break;
    }
    case 'count': {
      const delta = +el.dataset.d, v = Math.max(0, (+d[k] || 0) + delta);
      if (delta > 0) { addTotal(delta); buzz(); }
      d[k] = v; save(); const y = scrollY; render(); scrollTo(0, y);
      break;
    }
    case 'timer': runTimer(el, k, +el.dataset.sec); break;
    case 'breath': runBreath(el, k, +el.dataset.times); break;
    case 'done': {
      const n = ui.n; rec(n).done = today(); save();
      render(); scrollTo(0, 0); stamp(n);
      break;
    }
    case 'undone': delete rec(ui.n).done; save(); render(); break;
    case 'theme': S.theme = el.dataset.v; save(); render(); break;
    case 'size': S.size = el.dataset.v; save(); render(); break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'reset':
      if (confirm('書いたことをすべて消します。よろしいですか？') && confirm('本当に消しますか？元に戻せません。')) {
        S = fresh(); save(); ui = { tab: 'today', n: null, sec: null }; render();
      }
      break;
  }
});

function runTimer(btn, k, sec) {
  clearInterval(timers[k]);
  const out = document.getElementById('tm-' + k); let left = sec;
  btn.disabled = true; out.textContent = fmtSec(left);
  timers[k] = setInterval(() => {
    left--; out.textContent = fmtSec(left);
    if (left <= 0) {
      clearInterval(timers[k]); rec(ui.n).data[k] = true; addTotal(); save();
      out.textContent = '済'; btn.disabled = false; btn.textContent = 'もう一度'; toast('ありがとう'); buzz();
    }
  }, 1000);
}
function runBreath(btn, k, times) {
  const orb = document.getElementById('orb-' + k), say = document.getElementById('say-' + k);
  btn.disabled = true; let i = 0;
  const step = () => {
    if (i >= times) { btn.disabled = false; say.textContent = `今日の深呼吸：${rec(ui.n).data[k]}回`; toast('ありがとう'); return; }
    say.textContent = `${i + 1}回目　ゆっくり吸って…`; orb.classList.add('in');
    setTimeout(() => {
      say.textContent = '吐きながら「ありがとう」'; orb.classList.remove('in');
      setTimeout(() => { i++; rec(ui.n).data[k] = (+rec(ui.n).data[k] || 0) + 1; addTotal(); save(); step(); }, 4500);
    }, 4500);
  };
  step();
}

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `ザ・マジック記録-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data.days !== 'object') throw new Error();
    if (!confirm('今の記録を、このファイルの内容で置きかえます。よろしいですか？')) return;
    S = Object.assign(fresh(), data); save(); ui = { tab: 'today', n: null, sec: null }; render(); toast('読みこみました');
  } catch (err) { toast('このファイルは読みこめませんでした'); }
  e.target.value = '';
});

render();

// 新しい版をあげた時、スマホに古いページが残っていても自動で読み直す（あげ直すたびに VERSION を変える）
const VERSION = '2026-10-29.3';
fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
  const v = t.match(/const VERSION = '([^']+)'/)?.[1];
  let done = null; try { done = sessionStorage.getItem('reloadedFor'); } catch (e) {}
  if (v && v !== VERSION && done !== v) { try { sessionStorage.setItem('reloadedFor', v); } catch (e) {} location.replace(location.pathname + '?v=' + v); }
}).catch(() => {});
</script>
</body>
</html>
