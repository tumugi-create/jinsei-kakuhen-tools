<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ザ・マジック">
<meta name="theme-color" content="#3b2f86">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ザ・マジック 28日間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf7ef;
  --card: #ffffff;
  --ink: #2b2419;
  --muted: #6b604e;
  --line: #e4d9c4;
  --field: #fffdf8;
  --gold: #a87720;
  --gold-soft: #f6e9c8;
  --gold-ink: #5e400a;
  --on-gold: #ffffff;
  --accent: #4b3f8f;
  --ok: #2f7a4a;
  --ok-soft: #e3f3e8;
  --shadow: 0 1px 2px rgba(60,40,10,.06), 0 4px 16px rgba(60,40,10,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14122a; --card: #1e1b3a; --ink: #f3eee2; --muted: #b3acd0; --line: #3a3466; --field: #17152f;
    --gold: #e3b552; --gold-soft: #3a3150; --gold-ink: #f6dc9c; --on-gold: #1e1b3a;
    --accent: #b5a8ff; --ok: #7fd89c; --ok-soft: #1f3a33;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #14122a; --card: #1e1b3a; --ink: #f3eee2; --muted: #b3acd0; --line: #3a3466; --field: #17152f;
  --gold: #e3b552; --gold-soft: #3a3150; --gold-ink: #f6dc9c; --on-gold: #1e1b3a;
  --accent: #b5a8ff; --ok: #7fd89c; --ok-soft: #1f3a33;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}
/* 文字の大きさ（設定で切りかえ） */
html { font-size: 18px; }
html[data-size="m"] { font-size: 16px; }
html[data-size="l"] { font-size: 19px; }
html[data-size="xl"] { font-size: 22px; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  font-size: 1rem;
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 12px 16px calc(110px + env(safe-area-inset-bottom)); }
h1, h2, h3 { font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif; line-height: 1.4; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea {
  font: inherit; font-size: max(16px, 1rem); color: var(--ink); background: var(--field);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; width: 100%; min-height: 3rem;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
input:focus, textarea:focus { outline: 3px solid var(--gold); outline-offset: 1px; border-color: transparent; }
textarea { min-height: 6rem; resize: vertical; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 12px; }
header.top h1 { font-size: 1.3rem; letter-spacing: .04em; }
header.top h1 small { display: block; font-family: "Zen Maru Gothic", sans-serif; font-size: .7rem; color: var(--muted); letter-spacing: 0; font-weight: 400; }
.total { text-align: right; font-size: .7rem; color: var(--muted); white-space: nowrap; }
.total b { display: block; font-size: 1.3rem; color: var(--gold); font-family: "Shippori Mincho", serif; line-height: 1.2; }

/* タブ：スマホは画面の下、PCは上 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; background: var(--card); border-top: 1px solid var(--line);
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 12px rgba(0,0,0,.06);
}
nav.tabs button {
  flex: 1; border: 0; background: transparent; border-radius: 12px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  min-height: 60px; padding: 4px 2px; font-size: .72rem; line-height: 1.3;
}
nav.tabs button .i { font-size: 1.45rem; line-height: 1.2; }
nav.tabs button[aria-current="true"] { background: var(--gold-soft); color: var(--gold-ink); font-weight: 700; }
@media (min-width: 768px) {
  .wrap { padding-bottom: 48px; }
  nav.tabs { position: sticky; top: 8px; bottom: auto; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; box-shadow: var(--shadow); padding: 4px; gap: 4px; }
  nav.tabs button { flex-direction: row; gap: 6px; min-height: 44px; font-size: .9rem; }
  nav.tabs button .i { font-size: 1.1rem; }
}

.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card h3 { font-size: 1.15rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
.voice { font-size: .85rem; background: var(--gold-soft); color: var(--gold-ink); border-radius: 12px; padding: 8px 12px; margin: 0 0 14px; }

.dayhead { text-align: center; padding: 22px 16px; }
.dayhead .num { font-size: .85rem; color: var(--gold); letter-spacing: .1em; font-weight: 700; }
.dayhead h2 { font-size: 1.6rem; margin: 4px 0 2px; }
.dayhead .lead { margin: 8px 0 0; }
.dayhead .phase { display: inline-block; margin-top: 10px; font-size: .75rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 12px; }

.sec-title { font-size: 1.05rem; margin: 4px 4px 10px; color: var(--muted); font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; }
.secs { display: grid; gap: 12px; margin-bottom: 16px; }
.sec-btn {
  display: grid; grid-template-columns: 2.6rem 1fr auto; align-items: center; gap: 12px; text-align: left;
  width: 100%; min-height: 5rem; padding: 14px 16px; border-radius: 18px;
  background: var(--card); border: 2px solid var(--line); box-shadow: var(--shadow);
  transition: transform .1s;
}
.sec-btn:active { transform: scale(.98); }
.sec-btn .ic { font-size: 2rem; line-height: 1; text-align: center; }
.sec-btn .tx { min-width: 0; }
.sec-btn .tx b { display: block; font-size: 1.1rem; }
.sec-btn .tx small { display: block; color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec-btn .st { font-size: .85rem; font-weight: 700; color: var(--gold-ink); background: var(--gold-soft); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
.sec-btn.ok { border-color: var(--ok); }
.sec-btn.ok .st { background: var(--ok-soft); color: var(--ok); }

.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 8px 4px 12px; min-height: 48px; font-size: 1rem; }

.daynav { display: flex; justify-content: space-between; gap: 8px; margin: 8px 0 16px; }
.daynav button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 14px; min-height: 44px; font-size: .85rem; color: var(--muted); }
.daynav button:disabled { opacity: .35; cursor: default; }

ol.steps { margin: 0; padding-left: 1.4em; }
ol.steps li { margin-bottom: 6px; }

.row { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: 8px 10px; align-items: start; margin-bottom: 14px; }
.row .no { font-family: "Shippori Mincho", serif; color: var(--gold); font-weight: 700; text-align: right; padding-top: 10px; font-size: 1.1rem; }
.row .fields { display: grid; gap: 6px; min-width: 0; }
.row .fields input.why { font-size: max(16px, .9rem); min-height: 2.6rem; }
.row.solo { grid-template-columns: 1fr auto; }

.thx {
  border: 2px solid var(--gold); background: transparent; color: var(--gold-ink); font-weight: 700;
  border-radius: 999px; padding: 6px 16px; min-height: 3rem; white-space: nowrap; min-width: 9rem;
  font-size: .95rem; transition: background .2s, transform .1s;
}
.thx:active { transform: scale(.96); }
.thx .dots { letter-spacing: 3px; margin-left: 6px; color: var(--gold); }
.thx.full { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.thx.full .dots { color: var(--on-gold); }

.person { border-top: 1px dashed var(--line); padding-top: 16px; margin-top: 16px; }
.person:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.person .pname { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 10px; }
.person .pname input { font-weight: 700; }

label.chk { display: flex; gap: 12px; align-items: center; padding: 8px 0; min-height: 48px; cursor: pointer; }
label.chk input { width: 28px; height: 28px; min-height: 0; accent-color: var(--gold); flex: none; }
.field { margin-bottom: 18px; }
.field > .lbl { display: block; font-size: .95rem; font-weight: 700; margin-bottom: 6px; }

.counter { text-align: center; }
.counter .big { font-family: "Shippori Mincho", serif; font-size: 3rem; color: var(--gold); line-height: 1.1; }
.counter .big small { font-size: 1rem; color: var(--muted); }
.bar { height: 10px; background: var(--gold-soft); border-radius: 999px; overflow: hidden; margin: 10px 0 14px; }
.bar > i { display: block; height: 100%; background: var(--gold); border-radius: 999px; transition: width .3s; }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 18px; min-height: 3rem; font-size: .95rem; }
.btn.main { background: var(--gold); border-color: var(--gold); color: var(--on-gold); font-weight: 700; }
.btn.big { padding: 14px 28px; font-size: 1.1rem; min-height: 3.6rem; }
.btn.wide { width: 100%; max-width: 480px; }
.btn.ghost { background: transparent; }
.btn.danger { color: #c0392b; border-color: #e3b0aa; }

.breath { text-align: center; }
.orb { width: 140px; height: 140px; margin: 8px auto 12px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--gold-soft), var(--gold));
  transform: scale(.6); transition: transform 4s ease-in-out; opacity: .9; }
.orb.in { transform: scale(1); }
.breath .say { min-height: 1.8em; font-weight: 700; font-size: 1.1rem; }

.done-box { text-align: center; }
.done-box .stamp { font-family: "Shippori Mincho", serif; font-size: 1.25rem; color: var(--ok); margin-bottom: 8px; }
.left-list { list-style: none; padding: 0; margin: 0 0 14px; color: var(--muted); font-size: .9rem; }

.map { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.map button {
  aspect-ratio: 1; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px;
  font-family: "Shippori Mincho", serif; font-size: 1.1rem; min-width: 0; line-height: 1.2;
}
.map button small { font-family: "Zen Maru Gothic", sans-serif; font-size: .6rem; color: var(--muted); }
.map button.done { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.map button.done small { color: var(--on-gold); opacity: .85; }
.map button.cur { outline: 3px solid var(--accent); outline-offset: 1px; }
.phase-lbl { font-size: .85rem; color: var(--accent); margin: 16px 0 6px; font-weight: 700; }
.phase-lbl:first-child { margin-top: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .75rem; color: var(--muted); margin-top: 12px; }

.log-item { display: grid; grid-template-columns: 4.2rem 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; min-height: 48px; }
.log-item:first-child { border-top: 0; }
.log-item .d { font-family: "Shippori Mincho", serif; color: var(--gold); font-weight: 700; }
.log-item .d small { display: block; font-family: "Zen Maru Gothic", sans-serif; font-weight: 400; color: var(--muted); font-size: .7rem; }
.log-item .best { font-size: .85rem; color: var(--muted); }

.intro p { margin: 0 0 12px; }
.three { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; }
.three li { display: grid; grid-template-columns: 2rem 1fr; gap: 8px; background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.three li span { font-size: 1.4rem; line-height: 1.4; }
.note-small { font-size: .75rem; color: var(--muted); }
.wish-cat { margin-bottom: 16px; }
.wish-cat .lbl { font-weight: 700; font-size: .95rem; margin-bottom: 4px; }
.wish-cat input { margin-bottom: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 999px; font-size: 1rem;
  transition: all .3s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (min-width: 768px) { .toast { bottom: 24px; } }
.sparkle { position: fixed; pointer-events: none; z-index: 30; color: var(--gold); font-size: 1.3rem; animation: up .8s ease-out forwards; }
@keyframes up { from { opacity: 1; transform: translate(-50%, 0) scale(.8); } to { opacity: 0; transform: translate(-50%, -40px) scale(1.3); } }
.opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
.opt-row .btn { flex: 1; min-width: 6rem; }
.opt-row .btn[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); color: var(--gold-ink); font-weight: 700; }
.howto { margin: 0; padding-left: 1.3em; font-size: .9rem; }

/* スマホ：ありがとうボタンは入力欄の下に、横いっぱいで */
@media (max-width: 600px) {
  .card { padding: 16px; }
  .row { grid-template-columns: 1.4rem 1fr; }
  .row .thx { grid-column: 2; width: 100%; }
  .row.solo { grid-template-columns: 1fr; }
  .row.solo .thx { grid-column: 1; }
  .person .pname { grid-template-columns: 1fr; }
  .person .pname .thx { width: 100%; }
  .dayhead h2 { font-size: 1.4rem; }
  .map { gap: 4px; }
  .map button { font-size: 1rem; border-radius: 8px; }
}
</style>
<style>
/* ---------- ワクワクの演出 ---------- */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(1200px 500px at 50% -120px, rgba(227,181,82,.28), transparent 70%),
    radial-gradient(2px 2px at 12% 18%, var(--gold) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 12%, var(--gold) 50%, transparent 51%),
    radial-gradient(2px 2px at 88% 42%, var(--accent) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 24% 64%, var(--accent) 50%, transparent 51%),
    radial-gradient(2px 2px at 64% 82%, var(--gold) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 6% 90%, var(--gold) 50%, transparent 51%);
  opacity: .7; animation: twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .35; } to { opacity: .8; } }

.hero {
  position: relative; overflow: hidden; text-align: center; color: #fff;
  background: linear-gradient(150deg, #3b2f86 0%, #6a3d9a 45%, #c2843a 100%);
  border: 0; padding: 26px 18px 22px;
}
.hero::after {
  content: "✦　✧　✦　　✧　✦　✧"; position: absolute; left: 0; right: 0; top: 8px;
  font-size: .8rem; letter-spacing: .6em; color: rgba(255,230,160,.7); animation: twinkle 3s ease-in-out infinite alternate;
}
.hero .num { color: #ffe3a0; font-size: .85rem; letter-spacing: .15em; font-weight: 700; margin-top: 6px; }
.hero h2 { font-size: 1.7rem; margin: 4px 0 4px; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
.hero .lead { margin: 6px 0 0; color: rgba(255,255,255,.92); }
.hero .phase { display: inline-block; margin-top: 12px; font-size: .75rem; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 1px 12px; }
.ring-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }
.ring { width: 84px; height: 84px; flex: none; }
.ring circle { fill: none; stroke-width: 9; }
.ring .bg { stroke: rgba(255,255,255,.22); }
.ring .fg { stroke: #ffd77a; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .8s cubic-bezier(.3,1.4,.5,1); }
.ring text { fill: #fff; font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: central; font-family: "Shippori Mincho", serif; }
.ring-msg { text-align: left; font-size: .9rem; line-height: 1.5; color: #fff; }
.ring-msg b { display: block; font-size: 1.05rem; color: #ffe3a0; }

.word { text-align: center; font-family: "Shippori Mincho", serif; font-size: 1.05rem; padding: 16px 18px; }
.word small { display: block; font-family: "Zen Maru Gothic", sans-serif; font-size: .72rem; color: var(--gold); letter-spacing: .15em; margin-bottom: 2px; }

.streak { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.streak span { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: .85rem; box-shadow: var(--shadow); }
.streak b { color: var(--gold); font-size: 1.05rem; }

.total b.bump { animation: bump .5s ease-out; }
@keyframes bump { 30% { transform: scale(1.5); color: var(--accent); } }
.thx.full { animation: pop .45s ease-out; box-shadow: 0 0 0 4px var(--gold-soft); }
@keyframes pop { 40% { transform: scale(1.12); } }
.cheer { position: fixed; pointer-events: none; z-index: 31; font-weight: 700; color: var(--gold-ink); background: var(--gold-soft);
  border-radius: 999px; padding: 4px 12px; font-size: .9rem; white-space: nowrap; animation: cheer 1.3s ease-out forwards; }
@keyframes cheer { 0% { opacity: 0; transform: translate(-50%, 0) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -18px) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -56px) scale(1); } }
.sec-btn.ok .ic { animation: none; }
.sec-btn:not(.ok) .ic { animation: float 2.6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-4px); } }

.journey { height: 14px; background: var(--gold-soft); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; position: relative; }
.journey > i { display: block; height: 100%; background: linear-gradient(90deg, #6a3d9a, var(--gold)); border-radius: 999px; transition: width .8s; }
.map button.done::before { content: "★"; font-size: .7rem; line-height: 1; color: var(--on-gold); opacity: .9; }
.map button.cur { animation: glow 1.8s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 0 0 0 rgba(181,168,255,.0); } to { box-shadow: 0 0 12px 3px rgba(181,168,255,.55); } }
.map button.mile:not(.done) { border-style: dashed; border-color: var(--gold); }

/* お祝いの画面 */
.party { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(20,18,42,.55); backdrop-filter: blur(3px); animation: fade .3s ease-out; }
@keyframes fade { from { opacity: 0; } }
.party .box { position: relative; z-index: 2; background: var(--card); border-radius: 24px; padding: 28px 22px 22px; text-align: center; max-width: 420px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,.35); animation: rise .5s cubic-bezier(.3,1.5,.5,1); }
@keyframes rise { from { transform: translateY(40px) scale(.9); opacity: 0; } }
.party .medal { font-size: 4rem; line-height: 1; animation: spin 1.2s cubic-bezier(.3,1.4,.5,1); }
@keyframes spin { from { transform: rotateY(540deg) scale(.3); } }
.party h2 { font-size: 1.6rem; margin: 10px 0 6px; color: var(--gold); }
.party p { margin: 0 0 16px; }
.party .bigstat { font-family: "Shippori Mincho", serif; font-size: 1rem; color: var(--muted); margin-bottom: 16px; }
.party .bigstat b { font-size: 1.6rem; color: var(--accent); }
.confetti { position: fixed; top: -20px; z-index: 1; width: 10px; height: 14px; border-radius: 2px; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="toast" id="toast"></div>

<script>
// 各日の内容は、本の要点を自分の言葉で短くまとめたもの。くわしいやり方は本で確かめる。
const MORNING = { type: 'list', key: 'm', n: 10, why: true, thanks: 3,

}

    case 'check': return `<div class="field">${f.items.map((it, i) =>

    case 'people': {
      let h = '';
      for (let p = 0; p < f.n; p++) {
        h += `<div class="person"><div class="pname">${inp(`${f.key}.${p}.name`, `${p + 1}人目の名前`)}${thxBtn(`${f.key}.${p}.c`, 3)}</div>`;
        h += fList({ key: `${f.key}.${p}.i`, n: f.items, ph: p === 0 ? '例：いつも話を聞いてくれる' : '' });
        h += '</div>';
      }
      return `<div class="field">${h}</div>`;
    }
    case 'letters': {
      let h = '';
      for (let p = 0; p < f.n; p++) {
        h += `<div class="person"><div class="pname">${inp(`${f.key}.${p}.name`, `${p + 1}人目の名前`)}${thxBtn(`${f.key}.${p}.c`, 3)}</div>
          <textarea data-k="${f.key}.${p}.t" placeholder="${p === 0 ? '例：高校の先生。進路に迷った時に背中を押してくれて、今の仕事につながった' : 'してくれたこと・人生がどう変わったか'}">${esc(getP(d, `${f.key}.${p}.t`))}</textarea></div>`;
      }
      return `<div class="field">${h}</div>`;
    }
    case 'counter': {
      const v = +d[f.key] || 0, pct = Math.min(100, v / f.target * 100);
      return `<div class="field counter">${lbl}<div class="big">${v}<small> / ${f.target}${f.unit}</small></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="btns"><button class="btn main big" data-act="count" data-k="${f.key}" data-d="1">＋1 ありがとう</button>
        ${f.big ? `<button class="btn big" data-act="count" data-k="${f.key}" data-d="${f.big}">＋${f.big}</button>` : ''}
        <button class="btn ghost" data-act="count" data-k="${f.key}" data-d="-1">1つ戻す</button></div></div>`;
    }
    case 'timer': {
      const done = !!d[f.key];
      return `<div class="field counter">${lbl}<div class="big" id="tm-${f.key}">${done ? '✓' : fmtSec(f.sec)}</div>
        <div class="btns"><button class="btn main big" data-act="timer" data-k="${f.key}" data-sec="${f.sec}">${done ? 'もう一度' : 'はじめる'}</button></div></div>`;
    }
    case 'breath': {
      const v = +d[f.key] || 0;
      return `<div class="field breath"><div class="orb" id="orb-${f.key}"></div><div class="say" id="say-${f.key}">今日の深呼吸：${v}回</div>
        <div class="btns"><button class="btn main big" data-act="breath" data-k="${f.key}" data-times="${f.times}">${f.times}回の感謝の呼吸をはじめる</button></div></div>`;
    }
    case 'favs': return `<div class="field">${lbl}${DAYS.slice(0, 27).map((x, i) =>
      `<label class="chk"><input type="checkbox" data-k="${f.key}.${i + 1}" ${getP(d, `${f.key}.${i + 1}`) ? 'checked' : ''}>${i + 1}日目　${esc(x.t)}</label>`).join('')}</div>`;
  }
  return '';
}
const fmtSec = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

// ---------- 進み具合 ----------
const filledM = d => Object.values(d.m || {}).filter(x => x?.t?.trim()).length;
const hasVal = v => !!v && (typeof v !== 'object' || Object.values(v).some(hasVal));
const hasP = d => Object.entries(d).some(([k, v]) => k !== 'm' && k !== 'rock' && hasVal(v));
function todayPct(n) {
  const d = rec(n).data, parts = [Math.min(filledM(d), 10) / 10];
  if (dayDef(n).f.length) parts.push(hasP(d) ? 1 : 0);
  if (n >= 2) parts.push(getP(d, 'rock.c') ? 1 : 0);
  return Math.round(parts.reduce((a, b) => a + b, 0) / parts.length * 100);
}
function streak() {
  const dates = new Set(Object.values(S.days).map(r => r.done).filter(Boolean));
  const d = new Date(); let c = 0;
  const key = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  if (!dates.has(key(d))) d.setDate(d.getDate() - 1);
  while (dates.has(key(d))) { c++; d.setDate(d.getDate() - 1); }
  return c;
}
const doneCount = () => Object.entries(S.days).filter(([k, r]) => +k <= 28 && r.done).length;
const curSize = () => S.size || (touch ? 'l' : 'm');

// ---------- 画面 ----------
function render() {
  const root = document.documentElement;
  if (S.theme === 'auto') delete root.dataset.theme; else root.dataset.theme = S.theme;
  root.dataset.size = curSize();
  Object.values(timers).forEach(clearInterval);
  const cur = currentDay();
  if (ui.n == null) ui.n = cur;
  let h = `<header class="top"><h1>✦ ザ・マジック<small>28日間の感謝の実践</small></h1>
    <div class="total">ありがとうの数<b id="total">${S.total}</b></div></header>`;
  if (!S.started) { app.innerHTML = h + intro(); return; }
  const tabs = [['today', '🏠', '今日'], ['map', '🗺️', '地図'], ['log', '📖', '記録'], ['wish', '⭐', '願い'], ['set', '⚙️', '設定']];
  h += `<nav class="tabs">${tabs.map(([k, i, l]) => `<button data-act="tab" data-tab="${k}" aria-current="${ui.tab === k}"><span class="i">${i}</span>${l}</button>`).join('')}</nav>`;
  if (ui.tab === 'today') h += ui.sec ? viewSection() : viewHome(cur);
  else h += { map: viewMap, log: viewLog, wish: viewWish, set: viewSet }[ui.tab](cur);
  app.innerHTML = h;
}

function viewHome(cur) {
  const n = ui.n, def = dayDef(n), r = rec(n), d = r.data, ph = phaseOf(n);
  const pct = todayPct(n), C = 2 * Math.PI * 36;
  const msg = r.done ? ['今日の魔法、完了！', 'また明日も会いましょう'] : pct === 0 ? ['さあ、はじめよう', '下のボタンから、朝の感謝へ'] : pct < 100 ? ['いい調子！', 'あと少しで今日の魔法が完成'] : ['ぜんぶできた！', 'いちばん下のボタンで今日を終えよう'];
  let h = `<div class="card hero">

      <circle class="fg" cx="42" cy="42" r="36" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - (r.done ? 1 : pct / 100))}"/><text x="42" y="42">${r.done ? '✓' : pct + '%'}</text></svg>

    ${ph ? `<span class="phase">${ph.from}〜${ph.to}日目：${ph.name}</span>` : ''}
  </div>`;
  const st = streak();
  h += `<div class="streak"><span>🔥 連続 <b>${st}</b> 日</span><span>⭐ 達成 <b>${doneCount()}</b> / 28</span></div>`;
  const fm = filledM(d), items = [];

  if (def.f.length) items.push(secBtn('p', '✨', '今日の実践', def.t, false, hasP(d) ? 'つづき ›' : ''));

  h += `<h3 class="sec-title">今日やること</h3><div class="secs">${items.join('')}</div>`;
  if (r.done) {
    h += `<div class="card done-box"><div class="stamp">✦ ${n}日目 完了（${fmtDate(r.done)}） ✦</div>
      <p class="hint">${n < 28 ? 'また明日、次の魔法へ。' : n === 28 ? '28日間、おつかれさまでした。明日からも魔法は続きます。' : ''}</p>
      <button class="btn ghost" data-act="undone">完了を取り消す</button></div>`;
  } else if (n === cur) {
    const doneToday = Object.values(S.days).some(x => x.done === today());
    h += `<div class="card done-box">
      ${doneToday ? '<p class="hint">今日はもう1日分を終えています。1日に1つずつ進めるのがおすすめです。</p>' : ''}

      <p class="note-small" style="margin-top:8px">ぜんぶ書けていなくても終えられます。</p></div>`;
  }
  h += `<div class="card word"><small>今日の魔法のことば</small>${WORDS[(n - 1) % WORDS.length]}</div>`;
  h += `<div class="daynav"><button data-act="go" data-n="${n - 1}" ${n <= 1 ? 'disabled' : ''}>‹ 前の日</button>
    ${n !== cur ? `<button data-act="go" data-n="${cur}">今の日へ</button>` : ''}
    <button data-act="go" data-n="${n + 1}" ${n >= cur ? 'disabled' : ''}>次の日 ›</button></div>`;
  return h;
}

    case 'start':
      S.started = today(); save(); ui.n = 1;
      navigator.storage?.persist?.().catch(() => {});
      render(); confetti(40); break;
    case 'tab': ui.tab = el.dataset.tab; ui.sec = null; if (ui.tab === 'today') ui.n = currentDay(); render(); scrollTo(0, 0); break;
    case 'go': ui.n = Math.max(1, +el.dataset.n); ui.tab = 'today'; ui.sec = null; render(); scrollTo(0, 0); break;
    case 'sec': ui.sec = el.dataset.sec; render(); scrollTo(0, 0); break;
    case 'home': ui.sec = null; render(); scrollTo(0, 0); break;
    case 'thanks': {
      const max = +el.dataset.max, v = +getP(d, k) || 0;
      if (v < max) { setP(d, k, v + 1); addTotal(); save(); }
      const full = v + 1 >= max;
      sparkle(el, full ? 6 : 1);
      if (v < max && full) cheer(el);
      el.outerHTML = thxBtn(k, max);
      if (v < max && k.startsWith('m.') && morningAllDone()) { toast('☀️ 朝の感謝、ぜんぶできました！'); confetti(30); }
      break;
    }
    case 'count': {
      const delta = +el.dataset.d, v = Math.max(0, (+d[k] || 0) + delta);
      if (delta > 0) { addTotal(delta); sparkle(el, 3); }
      d[k] = v; save(); const y = scrollY; render(); scrollTo(0, y);
      break;
    }
    case 'timer': runTimer(el, k, +el.dataset.sec); break;
    case 'breath': runBreath(el, k, +el.dataset.times); break;
    case 'done': {
      const n = ui.n; rec(n).done = today(); save();
      render(); scrollTo(0, 0); party(n);
      break;
    }
    case 'undone': delete rec(ui.n).done; save(); render(); break;
    case 'theme': S.theme = el.dataset.v; save(); render(); break;
    case 'size': S.size = el.dataset.v; save(); render(); break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'reset':
      if (confirm('すべての記録を消します。よろしいですか？') && confirm('本当に消しますか？元に戻せません。')) {
        S = fresh(); save(); ui = { tab: 'today', n: null, sec: null }; render();
      }
      break;
  }
});

function runTimer(btn, k, sec) {
  clearInterval(timers[k]);
  const out = document.getElementById('tm-' + k); let left = sec;
  btn.disabled = true; out.textContent = fmtSec(left);
  timers[k] = setInterval(() => {
    left--; out.textContent = fmtSec(left);
    if (left <= 0) {
      clearInterval(timers[k]); rec(ui.n).data[k] = true; addTotal(); save();
      out.textContent = '✓'; btn.disabled = false; btn.textContent = 'もう一度'; toast('✨ ありがとう'); sparkle(out, 6);
    }
  }, 1000);
}
function runBreath(btn, k, times) {
  const orb = document.getElementById('orb-' + k), say = document.getElementById('say-' + k);
  btn.disabled = true; let i = 0;
  const step = () => {
    if (i >= times) { btn.disabled = false; say.textContent = `今日の深呼吸：${rec(ui.n).data[k]}回`; toast('✨ ありがとう'); sparkle(orb, 6); return; }
    say.textContent = `${i + 1}回目　ゆっくり吸って…`; orb.classList.add('in');
    setTimeout(() => {
      say.textContent = '吐きながら「ありがとう」'; orb.classList.remove('in');
      setTimeout(() => { i++; rec(ui.n).data[k] = (+rec(ui.n).data[k] || 0) + 1; addTotal(); save(); step(); }, 4500);
    }, 4500);
  };
  step();
}

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `ザ・マジック記録-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data.days !== 'object') throw new Error();
    if (!confirm('今の記録を、このファイルの内容で置きかえます。よろしいですか？')) return;
    S = Object.assign(fresh(), data); save(); ui = { tab: 'today', n: null, sec: null }; render(); toast('読みこみました');
  } catch (err) { toast('このファイルは読みこめませんでした'); }
  e.target.value = '';
});

render();
</script>
</body>
