<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ザ・マジック">
<meta name="theme-color" content="#a55bd3">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ザ・マジック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fdf6fa;
  --card: #ffffff;
  --ink: #2e2442;
  --muted: #74688a;
  --line: #efe2ee;
  --field: #fffafd;
  --purple: #7350d6;
  --pink: #e8568f;
  --peach: #f48a62;
  --lav: #f0eaff;
  --pink-soft: #ffe7f0;
  --peach-soft: #fff0e7;
  --shadow: 0 2px 0 rgba(115,80,214,.06), 0 8px 24px rgba(115,80,214,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1426; --card: #251c36; --ink: #f4eefb; --muted: #bbb0d2; --line: #3b2f53; --field: #1f182e;
    --purple: #b39cff; --pink: #ff8fbd; --peach: #ffb093; --lav: #30264a; --pink-soft: #3d2338; --peach-soft: #3a2a27;
    --shadow: 0 2px 0 rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #1a1426; --card: #251c36; --ink: #f4eefb; --muted: #bbb0d2; --line: #3b2f53; --field: #1f182e;
  --purple: #b39cff; --pink: #ff8fbd; --peach: #ffb093; --lav: #30264a; --pink-soft: #3d2338; --peach-soft: #3a2a27;
  --shadow: 0 2px 0 rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
}
/* 文字の大きさ（設定で切りかえ） */
html { font-size: 18px; }
html[data-size="m"] { font-size: 16px; }
html[data-size="l"] { font-size: 19px; }
html[data-size="xl"] { font-size: 22px; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  font-size: 1rem;
  line-height: 1.8;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 12px 16px calc(110px + env(safe-area-inset-bottom)); }
h1, h2, h3 { font-family: "Kiwi Maru", "Hiragino Maru Gothic ProN", serif; font-weight: 500; line-height: 1.45; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
svg.ico { width: 1.4em; height: 1.4em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
input, textarea {
  font: inherit; font-size: max(16px, 1rem); color: var(--ink); background: var(--field);
  border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px; width: 100%; min-height: 3rem;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
input:focus, textarea:focus { outline: 3px solid var(--pink-soft); border-color: var(--pink); }
textarea { min-height: 6rem; resize: vertical; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 12px; }
header.top h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 6px; }
header.top h1 .ico { color: var(--pink); width: 1.1em; height: 1.1em; fill: var(--pink-soft); }
header.top h1 small { display: block; font-family: "M PLUS Rounded 1c", sans-serif; font-size: .68rem; color: var(--muted); font-weight: 400; }
.total { text-align: right; font-size: .7rem; color: var(--muted); white-space: nowrap; }
.total b { display: block; font-family: "Kiwi Maru", serif; font-size: 1.35rem; color: var(--pink); line-height: 1.2; font-weight: 500; }

/* タブ：スマホは画面の下、PCは上 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; background: var(--card); border-top: 1px solid var(--line);
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(115,80,214,.06);
}
nav.tabs button {
  flex: 1; border: 0; background: transparent; border-radius: 14px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 60px; padding: 4px 2px; font-size: .72rem; line-height: 1.3;
}
nav.tabs button .ico { width: 1.5rem; height: 1.5rem; }
nav.tabs button[aria-current="true"] { background: var(--pink-soft); color: var(--pink); font-weight: 700; }
@media (min-width: 768px) {
  .wrap { padding-bottom: 48px; }
  nav.tabs { position: sticky; top: 8px; bottom: auto; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 16px; box-shadow: var(--shadow); padding: 4px; gap: 4px; }
  nav.tabs button { flex-direction: row; gap: 6px; min-height: 44px; font-size: .9rem; }
  nav.tabs button .ico { width: 1.15rem; height: 1.15rem; }
}

.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card h3 { font-size: 1.15rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
.bubble { width: 2.4rem; height: 2.4rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.bubble .ico { width: 1.35rem; height: 1.35rem; }
.bubble.m { background: var(--peach-soft); color: var(--peach); }
.bubble.p { background: var(--pink-soft); color: var(--pink); }
.bubble.r { background: var(--lav); color: var(--purple); }
.voice { display: flex; gap: 8px; align-items: flex-start; font-size: .85rem; background: var(--lav); color: var(--purple); border-radius: 14px; padding: 8px 12px; margin: 0 0 14px; }
.voice .ico { margin-top: .2em; width: 1.2em; height: 1.2em; }

/* いろどりの見出し */
.hero {
  position: relative; overflow: hidden; text-align: center; color: #fff; border: 0;
  background: linear-gradient(140deg, #6a4fd8 0%, #a55bd3 40%, #ec6a9f 75%, #f99a74 100%);
  padding: 26px 18px 22px; box-shadow: 0 10px 28px rgba(165,91,211,.25);
}
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
.hero::before { width: 220px; height: 220px; right: -70px; top: -90px; background: radial-gradient(circle, rgba(255,255,255,.28), rgba(255,255,255,0) 70%); }
.hero::after { width: 180px; height: 180px; left: -60px; bottom: -80px; background: radial-gradient(circle, rgba(255,214,190,.45), rgba(255,214,190,0) 70%); }
.hero > * { position: relative; z-index: 1; }
.hero .deco { position: absolute; z-index: 0; color: rgba(255,255,255,.55); fill: rgba(255,255,255,.25); stroke-width: 1.4; }
.hero .deco.a { width: 26px; height: 26px; left: 18px; top: 16px; animation: twinkle 3.2s ease-in-out infinite; }
.hero .deco.b { width: 16px; height: 16px; right: 28px; top: 54px; animation: twinkle 2.6s ease-in-out .6s infinite; }
.hero .deco.c { width: 20px; height: 20px; right: 46%; bottom: 14px; animation: twinkle 3.6s ease-in-out 1.2s infinite; }
@keyframes twinkle { 50% { opacity: .35; transform: scale(.8) rotate(12deg); } }
.hero .num { color: #fff3e8; font-size: .85rem; letter-spacing: .08em; font-weight: 700; }
.hero h2 { font-size: 1.7rem; margin: 4px 0 4px; }
.hero .lead { margin: 6px 0 0; color: rgba(255,255,255,.95); }
.hero .phase { display: inline-block; margin-top: 12px; font-size: .75rem; color: #fff; background: rgba(255,255,255,.18); border-radius: 999px; padding: 2px 12px; }
.ring-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }
.ring { width: 84px; height: 84px; flex: none; }
.ring circle { fill: none; stroke-width: 9; }
.ring .bg { stroke: rgba(255,255,255,.25); }
.ring .fg { stroke: #fff; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .8s cubic-bezier(.3,1.4,.5,1); }
.ring text { fill: #fff; font-size: 21px; text-anchor: middle; dominant-baseline: central; font-family: "Kiwi Maru", serif; }
.ring-msg { text-align: left; font-size: .9rem; line-height: 1.5; color: #fff; }
.ring-msg b { display: block; font-size: 1.05rem; font-family: "Kiwi Maru", serif; font-weight: 500; }

.streak { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.streak span { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: .85rem; box-shadow: var(--shadow); }
.streak .ico { width: 1.1em; height: 1.1em; color: var(--pink); }
.streak b { color: var(--purple); font-size: 1.05rem; font-family: "Kiwi Maru", serif; font-weight: 500; }

.sec-title { font-size: 1.05rem; margin: 4px 4px 10px; color: var(--muted); }
.secs { display: grid; gap: 12px; margin-bottom: 16px; }
.sec-btn {
  display: grid; grid-template-columns: 3.2rem 1fr auto; align-items: center; gap: 12px; text-align: left;
  width: 100%; min-height: 5rem; padding: 14px 16px; border-radius: 22px;
  background: var(--card); border: 2px solid var(--line); box-shadow: var(--shadow); transition: transform .1s;
}
.sec-btn:active { transform: scale(.98); }
.sec-btn .ic { width: 3.2rem; height: 3.2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.sec-btn .ic .ico { width: 1.7rem; height: 1.7rem; }
.sec-btn .ic.m { background: var(--peach-soft); color: var(--peach); }
.sec-btn .ic.p { background: var(--pink-soft); color: var(--pink); }
.sec-btn .ic.r { background: var(--lav); color: var(--purple); }
.sec-btn .tx { min-width: 0; }
.sec-btn .tx b { display: block; font-size: 1.1rem; font-family: "Kiwi Maru", serif; font-weight: 500; }
.sec-btn .tx small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--muted); font-size: .85rem; overflow: hidden; line-height: 1.5; }
.sec-btn .st { display: inline-flex; align-items: center; gap: 4px; font-size: .85rem; font-weight: 700; color: var(--purple); background: var(--lav); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
.sec-btn .st .ico { width: 1em; height: 1em; stroke-width: 2.6; }
.sec-btn.ok { border-color: var(--pink); }
.sec-btn.ok .st { background: var(--pink); color: #fff; }
.sec-btn:not(.ok) .ic .ico { animation: bob 2.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px) rotate(-6deg); } }

.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--purple); font-weight: 700; padding: 8px 4px 12px; min-height: 48px; font-size: 1rem; }

.daynav { display: flex; justify-content: space-between; gap: 8px; margin: 8px 0 16px; }
.daynav button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 16px; min-height: 44px; font-size: .85rem; color: var(--muted); }
.daynav button:disabled { opacity: .35; cursor: default; }

ol.steps { margin: 0; padding-left: 1.5em; }
ol.steps li { margin-bottom: 6px; }
ol.steps li::marker { color: var(--pink); font-family: "Kiwi Maru", serif; }

.row { display: grid; grid-template-columns: 1.8rem 1fr auto; gap: 8px 10px; align-items: start; margin-bottom: 16px; }
.row .no {
  width: 1.8rem; height: 1.8rem; margin-top: .6rem; border-radius: 50%; background: var(--pink-soft); color: var(--pink);
  display: flex; align-items: center; justify-content: center; font-family: "Kiwi Maru", serif; font-size: .9rem;
}
.row .fields { display: grid; gap: 6px; min-width: 0; }
.row .fields input.why { font-size: max(16px, .9rem); min-height: 2.6rem; }
.row.solo { grid-template-columns: 1fr auto; align-items: center; }

.thx {
  border: 2px solid var(--pink); background: var(--card); color: var(--pink); font-weight: 700;
  border-radius: 999px; padding: 6px 16px; min-height: 3rem; white-space: nowrap; min-width: 9.5rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: .95rem; transition: transform .1s;
}
.thx:active { transform: scale(.96); }
.thx .dots { display: inline-flex; gap: 4px; }
.thx .dots i { width: .75rem; height: .75rem; border-radius: 50%; border: 2px solid var(--pink); }
.thx .dots i.on { background: var(--pink); }
.thx.full { background: linear-gradient(135deg, #7350d6, #e8568f); color: #fff; border-color: transparent; animation: pop .45s ease-out; }
.thx.full .dots i { border-color: #fff; background: #fff; }
@keyframes pop { 40% { transform: scale(1.08); } }

.person { border-top: 1.5px dashed var(--line); padding-top: 16px; margin-top: 16px; }
.person:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.person .pname { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 10px; }
.person .pname input { font-weight: 700; }

label.chk { display: flex; gap: 12px; align-items: center; padding: 8px 0; min-height: 48px; cursor: pointer; }
label.chk input { width: 28px; height: 28px; min-height: 0; accent-color: var(--pink); flex: none; }
.field { margin-bottom: 18px; }
.field > .lbl { display: block; font-size: .95rem; font-weight: 700; margin-bottom: 6px; }

.counter { text-align: center; }
.counter .big { font-family: "Kiwi Maru", serif; font-size: 3rem; color: var(--pink); line-height: 1.15; }
.counter .big small { font-size: 1rem; color: var(--muted); }
.bar { height: 12px; background: var(--pink-soft); border-radius: 999px; overflow: hidden; margin: 10px 0 14px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #7350d6, #e8568f, #f48a62); border-radius: 999px; transition: width .3s; }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 10px 20px; min-height: 3rem; font-size: .95rem; }
.btn.main { background: linear-gradient(135deg, #7350d6, #e8568f); border-color: transparent; color: #fff; font-weight: 700; box-shadow: 0 6px 16px rgba(232,86,143,.25); }
.btn.big { padding: 14px 28px; font-size: 1.1rem; min-height: 3.6rem; }
.btn.wide { width: 100%; max-width: 480px; }
.btn.ghost { background: transparent; }
.btn.danger { color: #c63b4f; border-color: #f0b6c0; }

.breath { text-align: center; }
.orb { width: 140px; height: 140px; margin: 8px auto 12px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffe3ee, #e8568f 60%, #7350d6);
  transform: scale(.55); transition: transform 4s ease-in-out; opacity: .9; }
.orb.in { transform: scale(1); }
.breath .say { min-height: 1.8em; font-weight: 700; font-size: 1.1rem; }

.done-box { text-align: center; }
.done-box .stamp { font-family: "Kiwi Maru", serif; font-size: 1.2rem; color: var(--pink); margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }

.word { text-align: center; font-family: "Kiwi Maru", serif; font-size: 1.05rem; padding: 16px 18px; background: linear-gradient(135deg, var(--lav), var(--pink-soft)); border: 0; }
.word small { display: block; font-family: "M PLUS Rounded 1c", sans-serif; font-size: .72rem; color: var(--purple); font-weight: 700; margin-bottom: 2px; }

.journey { height: 14px; background: var(--pink-soft); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.journey > i { display: block; height: 100%; background: linear-gradient(90deg, #7350d6, #e8568f, #f48a62); border-radius: 999px; transition: width .8s; }
.map { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.map button {
  aspect-ratio: 1; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px;
  font-family: "Kiwi Maru", serif; font-size: 1.1rem; min-width: 0; line-height: 1.2;
}
.map button small { font-family: "M PLUS Rounded 1c", sans-serif; font-size: .58rem; color: var(--muted); }
.map button .ico { width: .9rem; height: .9rem; }
.map button.done { background: linear-gradient(140deg, #7350d6, #e8568f); border-color: transparent; color: #fff; }
.map button.done small { color: #fff; opacity: .9; }
.map button.cur { border: 2.5px solid var(--pink); animation: glow 1.8s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 0 0 0 rgba(232,86,143,0); } to { box-shadow: 0 0 0 5px rgba(232,86,143,.2); } }
.map button.mile:not(.done) { border-style: dashed; border-color: var(--peach); color: var(--peach); }
.phase-lbl { font-size: .85rem; color: var(--purple); margin: 16px 0 6px; font-weight: 700; }
.phase-lbl:first-of-type { margin-top: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .75rem; color: var(--muted); margin-top: 12px; }

.log-item { display: grid; grid-template-columns: 4.2rem 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; min-height: 48px; }
.log-item:first-of-type { border-top: 0; }
.log-item .d { font-family: "Kiwi Maru", serif; color: var(--pink); }
.log-item .d small { display: block; font-family: "M PLUS Rounded 1c", sans-serif; color: var(--muted); font-size: .7rem; }
.log-item .best { font-size: .85rem; color: var(--muted); }

.intro p { margin: 0 0 12px; }
.three { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; }
.three li { display: grid; grid-template-columns: 2.6rem 1fr; gap: 10px; align-items: center; background: var(--bg); border-radius: 16px; padding: 10px 12px; }
.three li .ic { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.three li .ic.m { background: var(--peach-soft); color: var(--peach); }
.three li .ic.p { background: var(--pink-soft); color: var(--pink); }
.three li .ic.r { background: var(--lav); color: var(--purple); }
.note-small { font-size: .75rem; color: var(--muted); }
.wish-cat { margin-bottom: 16px; }
.wish-cat .lbl { font-weight: 700; font-size: .95rem; margin-bottom: 4px; color: var(--purple); }
.wish-cat input { margin-bottom: 8px; }
.opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
.opt-row .btn { flex: 1; min-width: 6rem; }
.opt-row .btn[aria-pressed="true"] { border: 2px solid var(--pink); background: var(--pink-soft); color: var(--pink); font-weight: 700; }
.howto { margin: 0; padding-left: 1.3em; font-size: .9rem; }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 999px; font-size: 1rem;
  transition: all .3s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (min-width: 768px) { .toast { bottom: 24px; } }

/* キラッと・声かけ */
.sparkle { position: fixed; pointer-events: none; z-index: 30; width: 18px; height: 18px; animation: up .9s ease-out forwards; }
.sparkle svg { width: 100%; height: 100%; }
@keyframes up { from { opacity: 1; transform: translate(-50%, 0) scale(.6) rotate(0); } to { opacity: 0; transform: translate(-50%, -46px) scale(1.2) rotate(40deg); } }
.cheer { position: fixed; pointer-events: none; z-index: 31; font-weight: 700; color: #fff; background: linear-gradient(135deg, #7350d6, #e8568f);
  border-radius: 999px; padding: 4px 14px; font-size: .9rem; white-space: nowrap; animation: cheer 1.3s ease-out forwards; }
@keyframes cheer { 0% { opacity: 0; transform: translate(-50%, 0) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -18px) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -56px) scale(1); } }

/* お祝いの画面 */
.party { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(46,36,66,.5); backdrop-filter: blur(3px); animation: fade .3s ease-out; }
@keyframes fade { from { opacity: 0; } }
.party .box { position: relative; z-index: 2; background: var(--card); border-radius: 28px; padding: 24px 22px 22px; text-align: center; max-width: 420px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: rise .5s cubic-bezier(.3,1.5,.5,1); }
@keyframes rise { from { transform: translateY(40px) scale(.9); opacity: 0; } }
.badge { width: 130px; height: 150px; display: block; margin: 0 auto; animation: swing 1s cubic-bezier(.3,1.5,.5,1); transform-origin: 50% 0; }
@keyframes swing { 0% { transform: scale(.3) rotate(-25deg); opacity: 0; } 60% { transform: scale(1.05) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
.party h2 { font-size: 1.55rem; margin: 8px 0 6px; color: var(--pink); }
.party p { margin: 0 0 16px; }
.party .bigstat { color: var(--muted); margin-bottom: 16px; line-height: 1.6; }

  check: '<path d="M5.5 12.5l4.2 4.2L18.5 8"/>',
  flame: '<path d="M12 21c-3.6 0-6-2.4-6-5.6 0-3.4 2.6-5 3.4-8.4 2.2 1.4 2.8 3.4 2.8 4.8 1-.6 1.6-1.8 1.8-3 2 1.6 4 3.8 4 6.6 0 3.2-2.4 5.6-6 5.6z"/>',
  mic: '<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M6 11.5a6 6 0 0 0 12 0M12 17.5v3"/>',
};
const ico = (k, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const SEC_IC = { m: 'sun', p: 'spark', r: 'moon' };

// ---------- 部品 ----------
const touch = matchMedia('(pointer: coarse)').matches;
const voiceHint = () => touch ? `<p class="voice">${ico('mic')}<span>文字を打つのが大変な時は、キーボードのマイクを押して話すだけで書けます</span></p>` : '';
const WORDS = [
  '「ありがとう」を言うたびに、毎日は少しずつ明るくなる',
  '当たり前に見えるものほど、じつは贈りもの',
  '今日の小さな「よかった」を、ひとつ見つけよう',
  '感謝は、口に出すほど大きくなる',
  'うまくいかない日にも、ありがたいことはかくれている',
  '心をこめた「ありがとう」は、自分にも返ってくる',
  '今あるものに気づくと、もっとうれしいことに気づける',
  'ゆっくり深呼吸。それだけで、もう一つの恵み',
  'だれかの顔を思い浮かべて、心の中で「ありがとう」',
  '書けば書くほど、感謝はくっきり見えてくる',
  '今日という日は、二度と来ない特別な一日',
  'あなたのまわりは、思っているよりずっと恵みでいっぱい',
];
const CHEERS = ['すてき！', 'ありがとうが届いた', 'いいね！', 'その調子！', 'かんぺき！', 'うれしいね'];
const MILES = { 7: ['1週間 続きました！', '最初の1週間、すばらしい。感謝が習慣になりはじめています。'],
  14: ['折り返し地点！', '28日の旅の半分まで来ました。ここからは願いに感謝を向けていきます。'],
  21: ['3週間 達成！', 'ここまで来た自分に、まず「ありがとう」。ゴールはもうすぐです。'],
  28: ['28日間 やりとげました！', 'おめでとうございます。魔法はこれからも、毎日の「ありがとう」で続いていきます。'] };

function thxBtn(path, max, label = 'ありがとう') {
  const v = Math.min(+getP(rec(ui.n).data, path) || 0, max);
  const dots = Array.from({ length: max }, (_, i) => `<i class="${i < v ? 'on' : ''}"></i>`).join('');
  return `<button class="thx ${v >= max ? 'full' : ''}" data-act="thanks" data-k="${path}" data-max="${max}">${label}<span class="dots">${dots}</span></button>`;
}
function inp(path, ph = '', cls = '') {
  return `<input type="text" class="${cls}" data-k="${path}" value="${esc(getP(rec(ui.n).data, path))}" placeholder="${esc(ph)}">`;
}
function fList(f) {
  let h = '';
  for (let i = 0; i < f.n; i++) {
    h += `<div class="row"><div class="no">${i + 1}</div><div class="fields">${inp(`${f.key}.${i}.t`, i === 0 && f.ph ? f.ph : `${i + 1}つ目`)}${f.why ? inp(`${f.key}.${i}.w`, f.whyPh, 'why') : ''}</div>${f.thanks ? thxBtn(`${f.key}.${i}.c`, f.thanks) : ''}</div>`;
  }
  return h;
}
function field(f) {
  const d = rec(ui.n).data;
  const lbl = f.label ? `<span class="lbl">${esc(f.label)}</span>` : '';
  switch (f.type) {
    case 'list': return `<div class="field">${lbl}${fList(f)}</div>`;
    case 'text': return `<div class="field">${lbl}${inp(f.key, f.ph)}</div>`;
    case 'note': return `<div class="field">${lbl}<textarea data-k="${f.key}" placeholder="${esc(f.ph || '')}">${esc(d[f.key])}</textarea></div>`;
    case 'thanks': return `<div class="field"><div class="row solo"><div>${esc(f.label)}</div>${thxBtn(f.key, 3)}</div></div>`;
    case 'check': return `<div class="field">${f.items.map((it, i) =>
      `<label class="chk"><input type="checkbox" data-k="${f.key}.${i}" ${getP(d, `${f.key}.${i}`) ? 'checked' : ''}>${esc(it)}</label>`).join('')}</div>`;
    case 'people': {
      let h = '';
      for (let p = 0; p < f.n; p++) {
        h += `<div class="person"><div class="pname">${inp(`${f.key}.${p}.name`, `${p + 1}人目の名前`)}${thxBtn(`${f.key}.${p}.c`, 3)}</div>`;
        h += fList({ key: `${f.key}.${p}.i`, n: f.items, ph: p === 0 ? '例：いつも話を聞いてくれる' : '' });
        h += '</div>';
      }
      return `<div class="field">${h}</div>`;
    }
    case 'letters': {
      let h = '';
      for (let p = 0; p < f.n; p++) {
        h += `<div class="person"><div class="pname">${inp(`${f.key}.${p}.name`, `${p + 1}人目の名前`)}${thxBtn(`${f.key}.${p}.c`, 3)}</div>
          <textarea data-k="${f.key}.${p}.t" placeholder="${p === 0 ? '例：高校の先生。進路に迷った時に背中を押してくれて、今の仕事につながった' : 'してくれたこと・人生がどう変わったか'}">${esc(getP(d, `${f.key}.${p}.t`))}</textarea></div>`;
      }
      return `<div class="field">${h}</div>`;
    }
    case 'counter': {
      const v = +d[f.key] || 0, pct = Math.min(100, v / f.target * 100);
      return `<div class="field counter">${lbl}<div class="big">${v}<small> / ${f.target}${f.unit}</small></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="btns"><button class="btn main big" data-act="count" data-k="${f.key}" data-d="1">＋1 ありがとう</button>
        ${f.big ? `<button class="btn big" data-act="count" data-k="${f.key}" data-d="${f.big}">＋${f.big}</button>` : ''}
        <button class="btn ghost" data-act="count" data-k="${f.key}" data-d="-1">1つ戻す</button></div></div>`;
    }
    case 'timer': {
      const done = !!d[f.key];
      return `<div class="field counter">${lbl}<div class="big" id="tm-${f.key}">${done ? 'できた' : fmtSec(f.sec)}</div>
        <div class="btns"><button class="btn main big" data-act="timer" data-k="${f.key}" data-sec="${f.sec}">${done ? 'もう一度' : 'はじめる'}</button></div></div>`;
    }
    case 'breath': {
      const v = +d[f.key] || 0;
      return `<div class="field breath"><div class="orb" id="orb-${f.key}"></div><div class="say" id="say-${f.key}">今日の深呼吸：${v}回</div>
        <div class="btns"><button class="btn main big" data-act="breath" data-k="${f.key}" data-times="${f.times}">${f.times}回の感謝の呼吸をはじめる</button></div></div>`;
    }
    case 'favs': return `<div class="field">${lbl}${DAYS.slice(0, 27).map((x, i) =>
      `<label class="chk"><input type="checkbox" data-k="${f.key}.${i + 1}" ${getP(d, `${f.key}.${i + 1}`) ? 'checked' : ''}>${i + 1}日目　${esc(x.t)}</label>`).join('')}</div>`;
  }
  return '';
}
const fmtSec = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

// ---------- 進み具合 ----------
const filledM = d => Object.values(d.m || {}).filter(x => x?.t?.trim()).length;
const hasVal = v => !!v && (typeof v !== 'object' || Object.values(v).some(hasVal));
const hasP = d => Object.entries(d).some(([k, v]) => k !== 'm' && k !== 'rock' && hasVal(v));
function todayPct(n) {
  const d = rec(n).data, parts = [Math.min(filledM(d), 10) / 10];
  if (dayDef(n).f.length) parts.push(hasP(d) ? 1 : 0);
  if (n >= 2) parts.push(getP(d, 'rock.c') ? 1 : 0);
  return Math.round(parts.reduce((a, b) => a + b, 0) / parts.length * 100);
}
function streak() {
  const dates = new Set(Object.values(S.days).map(r => r.done).filter(Boolean));
  const d = new Date(); let c = 0;
  const key = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  if (!dates.has(key(d))) d.setDate(d.getDate() - 1);
  while (dates.has(key(d))) { c++; d.setDate(d.getDate() - 1); }
  return c;
}
const doneCount = () => Object.entries(S.days).filter(([k, r]) => +k <= 28 && r.done).length;
const curSize = () => S.size || (touch ? 'l' : 'm');

// ---------- 画面 ----------
function render() {
  const root = document.documentElement;
  if (S.theme === 'auto') delete root.dataset.theme; else root.dataset.theme = S.theme;
  root.dataset.size = curSize();
  Object.values(timers).forEach(clearInterval);
  const cur = currentDay();
  if (ui.n == null) ui.n = cur;
  let h = `<header class="top"><h1>${ico('spark')}<span>ザ・マジック<small>28日間の感謝の実践</small></span></h1>
    <div class="total">ありがとうの数<b id="total">${S.total}</b></div></header>`;
  if (!S.started) { app.innerHTML = h + intro(); return; }
  const tabs = [['today', 'home', '今日'], ['map', 'cal', '28日'], ['log', 'book', '記録'], ['wish', 'heart', '願い'], ['set', 'tune', '設定']];
  h += `<nav class="tabs">${tabs.map(([k, i, l]) => `<button data-act="tab" data-tab="${k}" aria-current="${ui.tab === k}">${ico(i)}${l}</button>`).join('')}</nav>`;
  if (ui.tab === 'today') h += ui.sec ? viewSection() : viewHome(cur);
  else h += { map: viewMap, log: viewLog, wish: viewWish, set: viewSet }[ui.tab](cur);
  app.innerHTML = h;
}

function optRow(act, opts, val) {

const SIZES = [['m', 'ふつう'], ['l', '大きい'], ['xl', 'とても大きい']];
const heroDeco = () => `${ico('spark', 'deco a')}${ico('spark', 'deco b')}${ico('spark', 'deco c')}`;

function intro() {

    <p class="lead">毎日の「ありがとう」で、<br>人生に小さな魔法を起こしていく旅です。</p></div>

function secBtn(sec, title, sub, done, mid) {
  return `<button class="sec-btn ${done ? 'ok' : ''}" data-act="sec" data-sec="${sec}"><span class="ic ${sec}">${ico(SEC_IC[sec])}</span>
    <span class="tx"><b>${esc(title)}</b><small>${esc(sub)}</small></span><span class="st">${done ? ico('check') + 'できた' : mid || 'ひらく ›'}</span></button>`;
}

function viewHome(cur) {
  const n = ui.n, def = dayDef(n), r = rec(n), d = r.data, ph = phaseOf(n);
  const pct = todayPct(n), C = 2 * Math.PI * 36;
  const msg = r.done ? ['今日の魔法、完了！', 'また明日も会いましょう'] : pct === 0 ? ['さあ、はじめよう', '下のボタンから、朝の感謝へ'] : pct < 100 ? ['いい調子！', 'あと少しで今日の魔法が完成'] : ['ぜんぶできた！', 'いちばん下のボタンで今日を終えよう'];
  let h = `<div class="card hero">${heroDeco()}
    <div class="num">${n <= 28 ? `${n}日目 ／ 28日` : `${n}日目　28日の先へ`}</div>
    <h2>${esc(def.t)}</h2><p class="lead">${esc(def.lead)}</p>
    <div class="ring-wrap"><svg class="ring" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="36"/>
      <circle class="fg" cx="42" cy="42" r="36" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - (r.done ? 1 : pct / 100))}"/><text x="42" y="42">${r.done ? '完了' : pct + '%'}</text></svg>
      <div class="ring-msg"><b>${msg[0]}</b>${msg[1]}</div></div>
    ${ph ? `<span class="phase">${ph.from}〜${ph.to}日目：${ph.name}</span>` : ''}
  </div>`;
  h += `<div class="streak"><span>${ico('flame')}連続 <b>${streak()}</b> 日</span><span>${ico('heart')}達成 <b>${doneCount()}</b> / 28</span></div>`;
  const fm = filledM(d), items = [];
  items.push(secBtn('m', n === 1 ? '朝の感謝（今日の実践）' : '朝の感謝', `${fm} / 10個 書きました`, fm >= 10, fm ? 'つづき ›' : ''));
  if (def.f.length) items.push(secBtn('p', '今日の実践', def.t, false, hasP(d) ? 'つづき ›' : ''));
  if (n >= 2) items.push(secBtn('r', '夜の魔法の石', d.rock?.t || '寝る前に', !!getP(d, 'rock.c')));
  h += `<h3 class="sec-title">今日やること</h3><div class="secs">${items.join('')}</div>`;
  if (r.done) {
    h += `<div class="card done-box"><div class="stamp">${ico('heart')}${n}日目 完了（${fmtDate(r.done)}）</div>
      <p class="hint">${n < 28 ? 'また明日、次の魔法へ。' : n === 28 ? '28日間、おつかれさまでした。明日からも魔法は続きます。' : ''}</p>
      <button class="btn ghost" data-act="undone">完了を取り消す</button></div>`;
  } else if (n === cur) {
    const doneToday = Object.values(S.days).some(x => x.done === today());
    h += `<div class="card done-box">
      ${doneToday ? '<p class="hint">今日はもう1日分を終えています。1日に1つずつ進めるのがおすすめです。</p>' : ''}

      <p class="note-small" style="margin-top:8px">ぜんぶ書けていなくても終えられます。</p></div>`;
  }
  h += `<div class="card word"><small>今日のことば</small>${WORDS[(n - 1) % WORDS.length]}</div>`;
  h += `<div class="daynav"><button data-act="go" data-n="${n - 1}" ${n <= 1 ? 'disabled' : ''}>‹ 前の日</button>
    ${n !== cur ? `<button data-act="go" data-n="${cur}">今の日へ</button>` : ''}
    <button data-act="go" data-n="${n + 1}" ${n >= cur ? 'disabled' : ''}>次の日 ›</button></div>`;
  return h;
}

const stepsCard = def => `<div class="card"><h3>やり方</h3><ol class="steps">${def.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>`;
const secHead = (sec, title) => `<h3><span class="bubble ${sec}">${ico(SEC_IC[sec])}</span>${esc(title)}</h3>`;

}

    <div class="card"><h3>画面の色</h3>${optRow('theme', [['auto', '自動'], ['light', '明るい'], ['dark', '夜空']], S.theme)}</div>
    <div class="card"><h3>スマホのホーム画面に置く</h3><p class="hint">アプリのように、ホーム画面のアイコンからすぐ開けるようになります。記録も消えにくくなります。</p>
      <ul class="howto"><li><b>iPhone</b>：Safariで開いて、下の共有ボタン（四角に上向き矢印）→「ホーム画面に追加」</li>
      <li><b>Android</b>：Chromeで開いて、右上の「︙」→「ホーム画面に追加」</li></ul></div>
    <div class="card"><h3>バックアップ</h3><p class="hint">記録はこの機械の中だけに保存されています。機械を替える時や念のために、ときどきファイルに書き出してください。別の機械では「読みこむ」で続きから使えます。</p>
    <div class="btns" style="justify-content:flex-start"><button class="btn main" data-act="export">ファイルに書き出す</button><button class="btn" data-act="import">ファイルから読みこむ</button></div></div>
    <div class="card"><h3>最初からやり直す</h3><p class="hint">すべての記録を消して、1日目に戻ります。先にバックアップを取るのがおすすめです。</p>
    <button class="btn danger" data-act="reset">すべての記録を消す</button></div>
    <p class="note-small">開始日：${esc(S.started)}</p>`;
}

// ---------- 演出 ----------
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
const SPARK_COLORS = ['#e8568f', '#7350d6', '#f48a62', '#ffb3cf'];
function sparkle(el, count = 1) {
  const b = el.getBoundingClientRect();
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div'), c = SPARK_COLORS[i % SPARK_COLORS.length];
    s.className = 'sparkle';
    s.innerHTML = `<svg viewBox="0 0 24 24"><path fill="${c}" d="${i % 3 === 2 ? 'M12 20s-7.4-4.5-7.4-10a4.2 4.2 0 0 1 7.4-2.7A4.2 4.2 0 0 1 19.4 10c0 5.5-7.4 10-7.4 10z' : 'M12 2c.9 5.2 2.8 7.1 8 8-5.2.9-7.1 2.8-8 8-.9-5.2-2.8-7.1-8-8 5.2-.9 7.1-2.8 8-8z'}"/></svg>`;
    s.style.left = b.left + b.width / 2 + (count > 1 ? (Math.random() - .5) * b.width : 0) + 'px';
    s.style.top = b.top + (count > 1 ? Math.random() * b.height : 0) + 'px';
    s.style.animationDelay = i * 40 + 'ms';
    document.body.appendChild(s); setTimeout(() => s.remove(), 1100 + i * 40);
  }
}
function cheer(el) {
  const b = el.getBoundingClientRect(), c = document.createElement('div');
  c.className = 'cheer'; c.textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];
  c.style.left = b.left + b.width / 2 + 'px'; c.style.top = b.top - 6 + 'px';
  document.body.appendChild(c); setTimeout(() => c.remove(), 1300);
}
function confetti(n = 70) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#7350d6', '#e8568f', '#f48a62', '#ffb3cf', '#b39cff', '#ffd2a8'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', (Math.random() - .5) * 200 + 'px');
    c.style.setProperty('--rot', Math.random() * 1080 + 'deg');
    c.style.animationDuration = 2 + Math.random() * 2 + 's';
    c.style.animationDelay = Math.random() * .6 + 's';
    if (i % 3 === 0) c.style.borderRadius = '50%';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}
// リボン付きのバッジ（ごほうびの日は色を変える）
function badge(n) {
  const [r1, r2, c1, c2] = MILES[n] ? ['#f48a62', '#e8568f', '#ffb36b', '#f06292'] : ['#e8568f', '#7350d6', '#a55bd3', '#ec6a9f'];
  return `<svg class="badge" viewBox="0 0 130 150" aria-hidden="true">
    <defs><linearGradient id="bdg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <path d="M44 84 L30 142 L50 130 L62 148 L66 86z" fill="${r1}"/><path d="M86 84 L100 142 L80 130 L68 148 L64 86z" fill="${r2}"/>
    <circle cx="65" cy="62" r="50" fill="url(#bdg)"/><circle cx="65" cy="62" r="40" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 5" opacity=".8"/>
    <text x="65" y="60" text-anchor="middle" fill="#fff" font-family="Kiwi Maru, serif" font-size="34">${n}</text>
    <text x="65" y="84" text-anchor="middle" fill="#fff" font-family="M PLUS Rounded 1c, sans-serif" font-size="13" font-weight="700">日目</text>
    <path d="M20 22c.5 3 1.6 4.1 4.6 4.6-3 .5-4.1 1.6-4.6 4.6-.5-3-1.6-4.1-4.6-4.6 3-.5 4.1-1.6 4.6-4.6z M112 14c.4 2.4 1.3 3.3 3.7 3.7-2.4.4-3.3 1.3-3.7 3.7-.4-2.4-1.3-3.3-3.7-3.7 2.4-.4 3.3-1.3 3.7-3.7z" fill="#f48a62"/>
  </svg>`;
}
function party(n) {
  const m = MILES[n] || [`${n}日目 達成！`, n === 1 ? '魔法の旅の第一歩。最初の「ありがとう」が、もう魔法をはじめています。' : '今日も「ありがとう」をたくさん届けました。'];
  const left = Math.max(0, 28 - doneCount());
  const el = document.createElement('div');
  el.className = 'party';
  el.innerHTML = `<div class="box">${badge(n)}<h2>${esc(m[0])}</h2><p>${esc(m[1])}</p>
    <div class="bigstat"><div>ありがとうの数 <b>${S.total}</b></div>${n < 28 ? `<div>ゴールまで あと <b>${left}</b> 日</div>` : ''}</div>
    <button class="btn main big wide" data-close>やったね！</button></div>`;
  el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) el.remove(); });
  document.body.appendChild(el);
  confetti(MILES[n] ? 120 : 70);
  try { navigator.vibrate?.([20, 60, 40]); } catch (e) {}
}
function addTotal(k = 1) {
  S.total = (S.total || 0) + k;
  const t = document.getElementById('total');
  if (t) t.textContent = S.total;
}
const buzz = () => { try { navigator.vibrate?.(12); } catch (e) {} };
function morningAllDone() {
  const m = rec(ui.n).data.m || {};
  return [...Array(10).keys()].every(i => m[i]?.t?.trim() && m[i].c >= 3);
}

// ---------- 操作 ----------
const app = document.getElementById('app');
app.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.k) { setP(rec(ui.n).data, el.dataset.k, el.type === 'checkbox' ? el.checked : el.value); save(); }
  else if (el.dataset.w) { setP(S.wishes, el.dataset.w, el.value); save(); }
});
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, k = el.dataset.k, d = rec(ui.n).data;
  switch (act) {
    case 'start':
      S.started = today(); save(); ui.n = 1;
      navigator.storage?.persist?.().catch(() => {});
      render(); confetti(40); break;
    case 'tab': ui.tab = el.dataset.tab; ui.sec = null; if (ui.tab === 'today') ui.n = currentDay(); render(); scrollTo(0, 0); break;
    case 'go': ui.n = Math.max(1, +el.dataset.n); ui.tab = 'today'; ui.sec = null; render(); scrollTo(0, 0); break;
    case 'sec': ui.sec = el.dataset.sec; render(); scrollTo(0, 0); break;
    case 'home': ui.sec = null; render(); scrollTo(0, 0); break;
    case 'thanks': {
      const max = +el.dataset.max, v = +getP(d, k) || 0;
      if (v < max) { setP(d, k, v + 1); addTotal(); save(); buzz(); }
      const full = v + 1 >= max;
      sparkle(el, full ? 6 : 1);
      if (v < max && full) cheer(el);
      el.outerHTML = thxBtn(k, max);
      if (v < max && k.startsWith('m.') && morningAllDone()) { toast('朝の感謝、ぜんぶできました！'); confetti(30); }
      break;
    }
    case 'count': {
      const delta = +el.dataset.d, v = Math.max(0, (+d[k] || 0) + delta);
      if (delta > 0) { addTotal(delta); sparkle(el, 3); buzz(); }
      d[k] = v; save(); const y = scrollY; render(); scrollTo(0, y);
      break;
    }
    case 'timer': runTimer(el, k, +el.dataset.sec); break;
    case 'breath': runBreath(el, k, +el.dataset.times); break;
    case 'done': {
      const n = ui.n; rec(n).done = today(); save();
      render(); scrollTo(0, 0); party(n);
      break;
    }
    case 'undone': delete rec(ui.n).done; save(); render(); break;
    case 'theme': S.theme = el.dataset.v; save(); render(); break;
    case 'size': S.size = el.dataset.v; save(); render(); break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'reset':
      if (confirm('すべての記録を消します。よろしいですか？') && confirm('本当に消しますか？元に戻せません。')) {
        S = fresh(); save(); ui = { tab: 'today', n: null, sec: null }; render();
      }
      break;
  }
});

function runTimer(btn, k, sec) {
  clearInterval(timers[k]);
  const out = document.getElementById('tm-' + k); let left = sec;
  btn.disabled = true; out.textContent = fmtSec(left);
  timers[k] = setInterval(() => {
    left--; out.textContent = fmtSec(left);
    if (left <= 0) {
      clearInterval(timers[k]); rec(ui.n).data[k] = true; addTotal(); save();
      out.textContent = 'できた'; btn.disabled = false; btn.textContent = 'もう一度'; toast('ありがとう'); sparkle(out, 6); buzz();
    }
  }, 1000);
}
function runBreath(btn, k, times) {
  const orb = document.getElementById('orb-' + k), say = document.getElementById('say-' + k);
  btn.disabled = true; let i = 0;
  const step = () => {
    if (i >= times) { btn.disabled = false; say.textContent = `今日の深呼吸：${rec(ui.n).data[k]}回`; toast('ありがとう'); sparkle(orb, 6); return; }
    say.textContent = `${i + 1}回目　ゆっくり吸って…`; orb.classList.add('in');
    setTimeout(() => {
      say.textContent = '吐きながら「ありがとう」'; orb.classList.remove('in');
      setTimeout(() => { i++; rec(ui.n).data[k] = (+rec(ui.n).data[k] || 0) + 1; addTotal(); save(); step(); }, 4500);
    }, 4500);
  };
  step();
}

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `ザ・マジック記録-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data.days !== 'object') throw new Error();
    if (!confirm('今の記録を、このファイルの内容で置きかえます。よろしいですか？')) return;
    S = Object.assign(fresh(), data); save(); ui = { tab: 'today', n: null, sec: null }; render(); toast('読みこみました');
  } catch (err) { toast('このファイルは読みこめませんでした'); }
  e.target.value = '';
});

render();

// 新しい版をあげた時、スマホに古いページが残っていても自動で読み直す（あげ直すたびに VERSION を変える）
const VERSION = '2026-10-29.4';
fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
  const v = t.match(/const VERSION = '([^']+)'/)?.[1];
  let done = null; try { done = sessionStorage.getItem('reloadedFor'); } catch (e) {}
  if (v && v !== VERSION && done !== v) { try { sessionStorage.setItem('reloadedFor', v); } catch (e) {} location.replace(location.pathname + '?v=' + v); }
}).catch(() => {});
</script>
</body>
</html>
